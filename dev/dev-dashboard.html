<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpg" href="favicon.jpg"/>
<title>My Profile — NAC Pickleball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2a6c;--navy-dark:#111d4e;
  --green:#4caf28;--green-dark:#3a8c1e;
  --white:#ffffff;--off-white:#f4f7fb;
  --surface:#f0f4f9;--surface2:#e3eaf4;
  --text:#1a2a6c;--muted:#5a6a9a;--border:rgba(26,42,108,0.12);
  --danger:#d93b3b;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
  --radius:8px;--radius-lg:12px;
}
body{background:var(--off-white);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;-webkit-text-size-adjust:100%}
nav{background:var(--navy);padding:0 1.5rem;display:flex;align-items:center;flex-wrap:wrap;border-bottom:3px solid var(--green)}
.nav-brand{display:flex;align-items:center;gap:12px;padding:.65rem 0;margin-right:1.2rem;text-decoration:none}
.nav-logo{height:44px;width:auto}
.nav-link{color:#fff;font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-decoration:none;padding:.7rem 0;margin-right:1.2rem}
.nav-link:hover{text-decoration:underline}
.logout-btn{background:none;border:1.5px solid rgba(255,255,255,.4);color:#fff;font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;padding:7px 14px;border-radius:var(--radius)}
.logout-btn:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.page{padding:2rem 1.5rem;max-width:640px;margin:0 auto}
.profile-header{background:var(--navy);border-radius:var(--radius-lg);padding:1.5rem 2rem;display:flex;align-items:center;gap:1.5rem;margin-bottom:1.5rem}
.profile-avatar{width:60px;height:60px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:26px;font-weight:900;color:var(--white);flex-shrink:0}
.profile-header-info h1{font-family:var(--font-display);font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--white);line-height:1}
.profile-header-info p{color:rgba(255,255,255,.7);font-size:14px;margin-top:2px}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;box-shadow:0 1px 4px rgba(26,42,108,.06);margin-bottom:1.5rem}
.card h2{font-family:var(--font-display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:1rem;padding-bottom:.5rem;border-bottom:2px solid var(--green)}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:1rem}
.form-group label{font-size:12px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.form-group input{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px 14px;font-size:16px;font-family:var(--font-body);outline:none}
.form-group input:focus{border-color:var(--navy);background:var(--white)}
.form-group input:disabled{opacity:.6;cursor:not-allowed}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:10px 20px;border-radius:var(--radius);font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .12s;border:1.5px solid transparent}
.btn-primary{background:var(--navy);color:var(--white);border-color:var(--navy)}.btn-primary:hover{background:var(--navy-dark)}
.btn-green{background:var(--green);color:var(--white);border-color:var(--green)}.btn-green:hover{background:var(--green-dark)}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}.btn-ghost:hover{border-color:var(--navy);color:var(--navy)}
.dupr-status{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface);border-radius:var(--radius)}
.dupr-status .label{font-size:13px;color:var(--muted)}
.dupr-status .val{font-family:var(--font-display);font-weight:700;color:var(--navy);font-size:15px}
.badge-linked{font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--green-dark);background:rgba(76,175,40,.12);padding:2px 8px;border-radius:4px}
.ratings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1rem}
.rating-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:center}
.rating-box .rating-label{display:block;font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.rating-box .rating-val{display:block;font-family:var(--font-display);font-size:30px;font-weight:900;color:var(--navy);line-height:1}
.rating-box .rating-val.unrated{font-size:15px;font-weight:700;color:var(--muted);padding:8px 0}
.rating-loading{grid-column:1 / -1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;color:var(--muted);font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.msg.error{color:var(--danger)}.msg.success{color:var(--green-dark)}
.loading{text-align:center;padding:3rem;color:var(--muted);font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:var(--white);padding:10px 20px;border-radius:var(--radius);font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.5px;transform:translateY(80px);opacity:0;transition:all .25s;z-index:9999;pointer-events:none;border-left:4px solid var(--green)}
.toast.show{transform:translateY(0);opacity:1}
.nav-links{display:flex;gap:8px;margin-bottom:1.5rem;flex-wrap:wrap}
.nav-link-btn{flex:1;text-align:center;padding:12px;background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);font-family:var(--font-display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);text-decoration:none;transition:all .12s;min-width:120px}
.nav-link-btn:hover{border-color:var(--navy);background:var(--surface)}

/* ===== My Schedule (Stage 3) ===== */
.sched-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.sched-row:last-child{border-bottom:none}
.sched-wk{flex-shrink:0;width:46px;text-align:center;font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);line-height:1.1}
.sched-wk b{display:block;font-size:20px;font-weight:900;color:var(--navy);line-height:1}
.sched-main{flex:1;min-width:0}
.sched-matchup{font-size:14px;line-height:1.35}
.sched-matchup .me{font-weight:700;color:var(--navy)}
.sched-matchup .vs{color:var(--muted);font-family:var(--font-display);font-weight:700;font-size:12px;text-transform:uppercase;padding:0 4px}
.sched-matchup .opp{color:var(--text)}
.sched-meta{font-size:12px;color:var(--muted);margin-top:2px}
.sched-meta .win{color:var(--green-dark);font-weight:700}
.sched-meta .loss{color:var(--danger);font-weight:700}
.sched-action{flex-shrink:0}
.sched-action .btn{padding:7px 14px;font-size:12px}
.sched-bye{flex:1;font-size:13px;color:var(--muted);font-style:italic}
.empty-note{color:var(--muted);font-size:14px}

/* ===== Score modal (shared with league/admin pages) ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(10,20,60,.6);z-index:999;display:flex;align-items:flex-start;justify-content:center;padding:1rem;padding-top:max(1rem,env(safe-area-inset-top));overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--white);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:440px;border-top:4px solid var(--navy);margin:auto}
.modal h3{font-family:var(--font-display);font-size:22px;font-weight:900;text-transform:uppercase;color:var(--navy);margin-bottom:1.2rem;letter-spacing:.5px}
.modal-players{display:flex;align-items:center;gap:12px;margin-bottom:1rem}
.modal-player{flex:1;text-align:center}
.modal-player-name{font-weight:600;font-size:14px;color:var(--navy)}
.modal-vs{font-family:var(--font-display);font-weight:700;color:var(--muted)}
.game-row{display:grid;grid-template-columns:60px 1fr 28px 1fr;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)}
.game-row:last-child{border-bottom:none}
.game-label{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.game-input{width:100%;text-align:center;font-family:var(--font-display);font-size:20px;font-weight:700;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--navy);padding:5px 4px;outline:none;min-height:44px}
.game-input:focus{border-color:var(--navy)}.game-input.winner{border-color:var(--green);background:rgba(76,175,40,.06);color:var(--green-dark)}
.game-dash{text-align:center;font-family:var(--font-display);font-weight:700;color:var(--muted);font-size:16px}
.game-row-disabled .game-input{opacity:.35;pointer-events:none}
.series-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.3px}
.series-badge.complete{background:rgba(76,175,40,.12);color:var(--green-dark)}.series-badge.inprog{background:rgba(26,42,108,.08);color:var(--navy)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:1.2rem}

@media(max-width:600px){
  .page{padding:1rem}.form-row{grid-template-columns:1fr}.profile-header{padding:1.2rem}
  .modal{padding:1.4rem;max-width:100%}
  .modal h3{font-size:18px}
  .game-input{font-size:17px;padding:5px 2px}
  .game-row{grid-template-columns:50px 1fr 22px 1fr;gap:6px}
  .game-label{font-size:11px}
}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="dev-index.html"><img src="naclogo.png" class="nav-logo" alt="NAC"/></a>
  <a class="nav-link" href="dev-index.html">Leagues</a>
  <a class="nav-link" href="dev-rules.html">Rules</a>
  <a class="nav-link" href="dev-signup.html">Register</a>
  <button class="logout-btn" onclick="doLogout()">Sign Out</button>
</nav>

<div class="page" id="page">
  <div class="loading"><span class="spinner"></span>Loading...</div>
</div>

<!-- Score modal (driven by shared-dev.js: openModal / submitScore) -->
<div class="modal-overlay" id="score-modal">
  <div class="modal">
    <h3>Enter Series Scores</h3>
    <div class="modal-players" style="margin-bottom:1rem">
      <div class="modal-player"><div class="modal-player-name" id="modal-p1"></div></div>
      <div class="modal-vs">vs</div>
      <div class="modal-player"><div class="modal-player-name" id="modal-p2"></div></div>
    </div>
    <div style="display:grid;grid-template-columns:60px 1fr 28px 1fr;gap:8px;padding:0 0 4px 0;margin-bottom:2px">
      <span></span>
      <span style="text-align:center;font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)" id="col-p1-label"></span>
      <span></span>
      <span style="text-align:center;font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)" id="col-p2-label"></span>
    </div>
    <div id="modal-series-status" style="text-align:center;font-family:var(--font-display);font-size:13px;color:var(--muted);margin-bottom:1rem;min-height:18px"></div>
    <div id="modal-games"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="submit-btn" onclick="submitScore()">Save Series</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- shared-dev.js provides: schedule data layer (loadData/saveData), seriesResult,
     the score modal logic (openModal/submitScore/...), logScore, DUPR submit,
     SUPABASE_URL/KEY, LEAGUES, season helpers, showToast. -->
<script src="shared-dev.js"></script>
<script>
// supabase-js client for auth/profiles (uses the shared SUPABASE_URL/KEY constants)
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let myMembership = null;
let myMatches = [];          // [{week, idx, m}]
let myByes = [];             // [weekNumber]
let myName = '';             // derived "First L." used to find the player in the schedule
let scheduleReady = false;   // schedule published for this league/season?
let myRatings = null;        // {singles, doubles} from DUPR, or null
let ratingsLoading = false;

const DUPR_RATINGS_EDGE_URL = 'https://owsvfvhlbagxxmncwmtn.supabase.co/functions/v1/dupr-get-ratings';

const LEAGUE_NAMES = {
  beginner:'All Ages Beginner', int1949:'19-49 Intermediate', int50:'50+ Intermediate',
  adv1949:'19-49 Advanced', adv50:'50+ Advanced', singles:'Singles League'
};

window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if(!session){ window.location.href = 'dev-auth.html'; return; }
  currentUser = session.user;

  await loadProfile();
  await loadSeasons();          // shared-dev.js -> sets currentSeason / viewingSeason
  await loadMyMembership();     // -> myMembership for the active season
  await loadMySchedule();       // -> currentLeague + schedule + myMatches/myByes
  ratingsLoading = !!(currentProfile && currentProfile.dupr_id);
  render();

  // Pull the player's live DUPR rating (if linked) and refresh the card when it lands.
  if(currentProfile && currentProfile.dupr_id) loadMyDuprRatings();

  // After a self score entry, shared submitScore() calls renderScoreMatches(week)
  // if it exists — point that at our own re-render so the card refreshes.
  window.renderScoreMatches = function(){ recomputeMyMatches(); render(); };
});

// Build the player's schedule display name the SAME way the admin generates it:
//   `${first_name} ${last_initial}.`  e.g. "Jordan C."
function deriveMyName(p){
  const f = (p.first_name||'').trim();
  const li = ((p.last_name||'').trim()[0]) || '';
  return `${f} ${li}.`.trim();
}

function nameMatches(a, b){
  return (a||'').trim().toLowerCase() === (b||'').trim().toLowerCase();
}

// Is the player in this match? (singles p1/p2, doubles p1a/p1b/p2a/p2b)
function playerInMatch(m){
  const slots = m.p1a !== undefined ? [m.p1a,m.p1b,m.p2a,m.p2b] : [m.p1,m.p2];
  return slots.some(s => nameMatches(s, myName));
}

async function loadProfile(){
  const { data, error } = await supabaseClient
    .from('profiles').select('*').eq('id', currentUser.id).single();
  if(error){ console.warn('Profile load error:', error); }
  currentProfile = data || { id: currentUser.id, email: currentUser.email };
  myName = deriveMyName(currentProfile);
}

async function loadMyMembership(){
  try{
    const seasonId = currentSeason?.id || 'spring2026';
    const { data } = await supabaseClient.from('league_members')
      .select('*').eq('user_id', currentUser.id).eq('season_id', seasonId)
      .eq('status','active').maybeSingle();
    myMembership = data || null;
  }catch(e){ console.warn('membership load failed:', e); myMembership = null; }
}

async function loadMySchedule(){
  myMatches = []; myByes = []; scheduleReady = false;
  if(!myMembership) return;

  currentLeague = LEAGUES.find(l => l.id === myMembership.league_id) || null;
  if(!currentLeague) return;

  viewingSeason = currentSeason;

  // Only show a schedule the admin has actually published.
  if(!isScheduleGenerated(currentSeason, myMembership.league_id)) return;

  await loadData();             // shared-dev.js -> fills `schedule` + `PLAYERS`
  scheduleReady = true;
  recomputeMyMatches();
}

function recomputeMyMatches(){
  myMatches = []; myByes = [];
  for(const w of (schedule||[])){
    if(nameMatches(w.bye, myName)) myByes.push(w.week);
    (w.matches||[]).forEach((m, idx) => {
      if(playerInMatch(m)) myMatches.push({ week:w.week, idx, m });
    });
  }
  myMatches.sort((a,b)=> a.week - b.week);
  myByes.sort((a,b)=> a-b);
}

function render(){
  const p = currentProfile;
  const initials = ((p.first_name||'')[0]||'') + ((p.last_name||'')[0]||'');
  document.getElementById('page').innerHTML = `
    <div class="profile-header">
      <div class="profile-avatar">${initials.toUpperCase()||'?'}</div>
      <div class="profile-header-info">
        <h1>${p.first_name||''} ${p.last_name||''}</h1>
        <p>${p.email||''}</p>
      </div>
    </div>

    <div class="nav-links">
      <a class="nav-link-btn" href="dev-signup.html">${myMembership ? 'Manage My League' : 'Register for a League'}</a>
      <a class="nav-link-btn" href="dev-index.html">View Leagues</a>
    </div>

    <div class="card">
      <h2>My League${currentSeason?.name?' — '+currentSeason.name:''}</h2>
      ${myMembership ? `
        <div class="dupr-status" style="flex-wrap:wrap">
          <span class="val">${LEAGUE_NAMES[myMembership.league_id]||myMembership.league_id}</span>
          ${myMembership.partner_name ? `<span class="label">Partner: ${myMembership.partner_name}</span>` : ''}
          <span class="badge-linked">Registered</span>
        </div>
        <a class="btn btn-ghost" href="dev-signup.html" style="display:inline-block;text-decoration:none;margin-top:1rem">Switch / Edit</a>
      ` : `
        <p style="color:var(--muted);font-size:14px;margin-bottom:1rem">You're not registered for a league this season yet.</p>
        <a class="btn btn-green" href="dev-signup.html" style="display:inline-block;text-decoration:none">Register Now</a>
      `}
    </div>

    ${myScheduleCardHTML()}

    <div class="card">
      <h2>My Profile</h2>
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="p-first" value="${p.first_name||''}"/>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="p-last" value="${p.last_name||''}"/>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="p-email" value="${p.email||''}" disabled/>
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="p-phone" value="${p.phone||''}" placeholder="(555) 555-5555" oninput="this.value=formatPhone(this.value)"/>
      </div>
      <button class="btn btn-primary" onclick="saveProfile()">Save Profile</button>
      <div class="msg" id="profile-msg"></div>
    </div>

    <div class="card">
      <h2>DUPR Account</h2>
      ${p.dupr_id
        ? `<div class="dupr-status">
             <span class="label">Linked DUPR ID:</span>
             <span class="val">${p.dupr_id}</span>
             <span class="badge-linked">Connected</span>
           </div>
           ${duprRatingsHTML()}`
        : `<div style="background:rgba(217,59,59,.08);border:1px solid rgba(217,59,59,.3);border-radius:var(--radius);padding:12px 14px;margin-bottom:1rem">
             <p style="color:var(--danger);font-size:14px;font-weight:600;margin-bottom:2px">DUPR connection required</p>
             <p style="color:var(--muted);font-size:13px">You must link your DUPR account before you can register for a league.</p>
           </div>
           <a class="btn btn-green" href="dupr-connect.html?returnTo=dev-dashboard.html" style="display:inline-block;text-decoration:none">Connect DUPR Account</a>`
      }
    </div>
  `;
}

function myScheduleCardHTML(){
  // No league, or not yet shown anything to score against.
  if(!myMembership) return '';

  let inner;
  if(!scheduleReady){
    inner = `<p class="empty-note">Your schedule hasn't been posted yet. Check back once the organizer publishes it.</p>`;
  } else if(!myMatches.length && !myByes.length){
    inner = `<p class="empty-note">We couldn't find you in the published schedule. Your name there may differ slightly from your profile — reach out to the organizer if this looks wrong.</p>`;
  } else {
    // Merge matches + byes into one week-ordered list.
    const rows = [];
    myMatches.forEach(x => rows.push({ week:x.week, type:'match', x }));
    myByes.forEach(wk => rows.push({ week:wk, type:'bye' }));
    rows.sort((a,b)=> a.week - b.week || (a.type==='bye'?1:-1));
    inner = rows.map(r => r.type==='bye' ? byeRowHTML(r.week) : matchRowHTML(r.x)).join('');
  }

  return `<div class="card"><h2>My Schedule</h2>${inner}</div>`;
}

function byeRowHTML(week){
  return `<div class="sched-row">
    <div class="sched-wk">Wk<b>${week}</b></div>
    <div class="sched-bye">Bye week — no match</div>
  </div>`;
}

function matchRowHTML({week, idx, m}){
  const r = seriesResult(m);
  const isDoubles = r.isDoubles;

  // Which side am I on? Build "my side" and "opponent side".
  let mySide, oppSide;
  if(isDoubles){
    const team1 = [m.p1a, m.p1b], team2 = [m.p2a, m.p2b];
    const onTeam1 = team1.some(s => nameMatches(s, myName));
    const me = onTeam1 ? team1 : team2;
    const opp = onTeam1 ? team2 : team1;
    const partner = me.find(s => !nameMatches(s, myName)) || '';
    mySide = `You${partner ? ' + ' + partner : ''}`;
    oppSide = opp.filter(Boolean).join(' / ');
    var mySideTeam = onTeam1 ? r.team1 : r.team2;
  } else {
    const onP1 = nameMatches(m.p1, myName);
    mySide = 'You';
    oppSide = onP1 ? m.p2 : m.p1;
    var mySideTeam = onP1 ? r.team1 : r.team2;
  }

  // Result / status meta line.
  let meta;
  if(r.complete){
    const iWon = r.winner === mySideTeam;
    meta = `<span class="${iWon?'win':'loss'}">${iWon?'Won':'Lost'} ${Math.max(r.p1w,r.p2w)}-${Math.min(r.p1w,r.p2w)}</span>`;
  } else {
    const gamesPlayed = (m.games||[]).filter(g=>g.s1!==null).length;
    meta = gamesPlayed>0 ? `In progress — game ${gamesPlayed+1}` : 'Not played yet';
  }

  const btnLabel = r.complete ? 'Edit' : 'Enter Scores';
  const btnClass = r.complete ? 'btn btn-ghost' : 'btn btn-green';

  return `<div class="sched-row">
    <div class="sched-wk">Wk<b>${week}</b></div>
    <div class="sched-main">
      <div class="sched-matchup">
        <span class="me">${mySide}</span><span class="vs">vs</span><span class="opp">${oppSide}</span>
      </div>
      <div class="sched-meta">${meta}</div>
    </div>
    <div class="sched-action">
      <button class="${btnClass}" onclick="openModal(${week},${idx})">${btnLabel}</button>
    </div>
  </div>`;
}

async function loadMyDuprRatings(){
  const id = currentProfile && currentProfile.dupr_id;
  if(!id) return;
  ratingsLoading = true;
  try{
    const rr = await fetch(DUPR_RATINGS_EDGE_URL, {
      method: 'POST',
      headers: {
        'Content-Type':'application/json',
        'Authorization':'Bearer '+SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ duprIds: [id] })
    });
    if(rr.ok){
      const data = await rr.json();
      const byId = data.ratings || {};
      const r = byId[id];
      myRatings = r ? { singles: r.singles, doubles: r.doubles } : { singles:null, doubles:null };
    } else {
      console.warn('Ratings fetch failed:', rr.status, await rr.text());
      myRatings = null;
    }
  }catch(e){ console.warn('Could not load DUPR rating:', e); myRatings = null; }
  ratingsLoading = false;
  render();
}

// DUPR returns a number, a numeric string, or null (unrated). Normalize to 2 decimals.
function fmtRating(v){
  if(v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return isNaN(n) ? null : n.toFixed(3);
}

function duprRatingsHTML(){
  if(ratingsLoading){
    return `<div class="ratings-grid"><div class="rating-loading"><span class="spinner"></span>Fetching live rating…</div></div>`;
  }
  if(!myRatings) return '';   // fetch failed or not attempted
  const d = fmtRating(myRatings.doubles);
  const s = fmtRating(myRatings.singles);
  const cell = (label, val) => `<div class="rating-box">
      <span class="rating-label">${label}</span>
      <span class="rating-val${val?'':' unrated'}">${val || 'Not rated'}</span>
    </div>`;
  return `<div class="ratings-grid">${cell('Doubles', d)}${cell('Singles', s)}</div>`;
}

function formatPhone(v){
  v = (v||'').replace(/\D/g,'').slice(0,10);
  if(v.length>=7) return '('+v.slice(0,3)+') '+v.slice(3,6)+'-'+v.slice(6);
  if(v.length>=4) return '('+v.slice(0,3)+') '+v.slice(3);
  if(v.length>=1) return '('+v;
  return '';
}

async function saveProfile(){
  const first = document.getElementById('p-first').value.trim();
  const last = document.getElementById('p-last').value.trim();
  const phone = formatPhone(document.getElementById('p-phone').value);
  const msg = document.getElementById('profile-msg');

  if(phone && !/^\(\d{3}\) \d{3}-\d{4}$/.test(phone)){
    msg.className='msg error'; msg.textContent='Phone must be (xxx) xxx-xxxx.'; return;
  }

  const { error } = await supabaseClient
    .from('profiles')
    .update({ first_name: first, last_name: last, phone })
    .eq('id', currentUser.id);

  if(error){ msg.className='msg error'; msg.textContent = error.message; return; }
  currentProfile.first_name = first;
  currentProfile.last_name = last;
  currentProfile.phone = phone;
  // Name change could change which schedule entries match — recompute.
  myName = deriveMyName(currentProfile);
  if(scheduleReady) recomputeMyMatches();
  showToast('Profile saved!');
  render();
}

async function doLogout(){
  await supabaseClient.auth.signOut();
  window.location.href = 'dev-auth.html';
}
