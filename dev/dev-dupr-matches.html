<html lang="en">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2a6c;--navy-dark:#111d4e;--green:#4caf28;--green-dark:#3a8c1e;
  --white:#fff;--off-white:#f4f7fb;--surface:#f0f4f9;--surface2:#e3eaf4;
  --text:#1a2a6c;--muted:#5a6a9a;--border:rgba(26,42,108,0.12);--danger:#d93b3b;
  --font-display:'Barlow Condensed',sans-serif;--font-body:'Barlow',sans-serif;
  --radius:8px;--radius-lg:12px;
}
body{background:var(--off-white);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;-webkit-text-size-adjust:100%}
nav{background:var(--navy);padding:0 max(1.5rem,env(safe-area-inset-right)) 0 max(1.5rem,env(safe-area-inset-left));display:flex;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--green)}
.nav-brand{display:flex;align-items:center;gap:12px;padding:.65rem 0;margin-right:1.2rem;text-decoration:none}
.nav-logo{height:44px;width:auto}
.nav-link{padding:1rem .95rem;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.6);text-decoration:none;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;cursor:pointer}
.nav-link:hover{color:#fff}
.nav-link.current{color:var(--green);border-bottom-color:var(--green)}
.nav-right{display:flex;align-items:center;flex-wrap:wrap;margin-left:auto}
.page{padding:2rem 1.5rem;max-width:1100px;margin:0 auto}
.page-head{margin-bottom:1.25rem}
.page-head h1{font-family:var(--font-display);font-size:30px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);line-height:1}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px}
.section{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;box-shadow:0 1px 4px rgba(26,42,108,.06);margin-bottom:1.5rem}
.lg-head{display:flex;align-items:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.lg-head h2{font-family:var(--font-display);font-size:20px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);line-height:1}
.count-pill{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--surface);padding:2px 10px;border-radius:10px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;box-shadow:0 1px 3px rgba(26,42,108,.05)}
.stat-card .v{font-family:var(--font-display);font-size:32px;font-weight:900;color:var(--navy);line-height:1}
.stat-card .l{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:4px}
.table-wrap{overflow-x:auto}
table.m{width:100%;border-collapse:collapse;min-width:640px}
table.m th{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:9px 10px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap}
table.m td{padding:10px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
table.m tr:last-child td{border-bottom:none}
.nw{white-space:nowrap}.ar{text-align:right}.sm{font-size:11px}.muted{color:var(--muted)}
code{font-family:monospace;font-size:12px;color:var(--muted)}
.badge{font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:4px}
.badge.ok{color:var(--green-dark);background:rgba(76,175,40,.12)}
.badge.pend{color:var(--muted);background:var(--surface)}
.badge.del{color:var(--danger);background:rgba(217,59,59,.1)}
.btn-sm{font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;border-radius:6px;border:1.5px solid transparent;cursor:pointer;margin-left:6px}
.btn-sm.green{background:var(--green);color:#fff;border-color:var(--green)}.btn-sm.green:hover{background:var(--green-dark)}
.btn-sm.ghost{background:transparent;color:var(--navy);border-color:var(--border)}.btn-sm.ghost:hover{background:var(--surface)}
.btn-sm.danger{background:transparent;color:var(--danger);border-color:rgba(217,59,59,.4)}.btn-sm.danger:hover{background:rgba(217,59,59,.08)}
.btn-sm:disabled{opacity:.4;cursor:not-allowed}
.gate{text-align:center;padding:4rem 1rem}
.gate h3{font-family:var(--font-display);font-size:24px;font-weight:900;text-transform:uppercase;color:var(--navy);margin-bottom:.5rem}
.gate p{color:var(--muted);margin-bottom:1.5rem}
.gate a{display:inline-block;padding:10px 20px;border-radius:var(--radius);font-family:var(--font-display);font-weight:700;text-transform:uppercase;letter-spacing:.5px;background:var(--navy);color:#fff;text-decoration:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:12px 22px;border-radius:var(--radius);font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);opacity:0;transition:all .25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:768px){.stats-row{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat-card{padding:.75rem}.stat-card .v{font-size:24px}}
</style>

<div class="page">
  <div id="gate" class="gate" style="display:none">
    <h3>Admins Only</h3>
    <p>Your account doesn't have admin access to this page.</p>
    <a href="dev-index.html">Back to Leagues</a>
  </div>

  <div id="content" style="display:none">
    <div class="page-head" style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div>
        <h1>DUPR Matches</h1>
        <p id="season-label">All completed matches across every league. Submit, update, or remove matches in DUPR.</p>
      </div>
      <button class="btn-sm ghost" style="margin-top:6px" onclick="loadAll()">↻ Refresh</button>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="v" id="stat-total">—</div><div class="l">Completed</div></div>
      <div class="stat-card"><div class="v" id="stat-sub">—</div><div class="l">In DUPR</div></div>
      <div class="stat-card"><div class="v" id="stat-pending">—</div><div class="l">Pending</div></div>
    </div>
    <div id="leagues-wrap"></div>
  </div>
</div>

<div id="toast"></div>

<script src="shared-dev.js"></script>
<script src="tournament-engine.js"></script>
<script>
let PAGE = {};      // leagueId -> { league, schedule, idMap, matches:[...] }
let subMap = {};    // identifier -> dupr_matches row
let adminDuprId = null;

function H(){ return { 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY }; }

// Deep-link to a match on DUPR (confirmed format: /match/detail/{numeric matchId}).
const DUPR_MATCH_URL = (id) => `https://dashboard.dupr.com/dashboard/match/detail/${id}`;
function toast(msg){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(()=>t.classList.remove('show'), 3200);
}

window.addEventListener('DOMContentLoaded', async () => {
  let admin = false;
  try{ admin = await checkAccountAdmin(); }catch(e){ admin = false; }
  if(admin){ document.getElementById('content').style.display=''; await loadAll(); }
  else { document.getElementById('gate').style.display=''; }
});

async function loadAdminDuprId(){
  try{
    const s = nacGetSession(); if(!s) return;
    const r = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=eq.${s.uid}&select=dupr_id`,
      { headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+s.token } });
    if(r.ok){ const d = await r.json(); adminDuprId = (d[0] && d[0].dupr_id) || null; }
  }catch(e){ /* ignore */ }
}

async function leagueDuprIds(leagueId){
  try{
    const r = await fetch(`${SUPABASE_URL}/rest/v1/dupr_players?league_key=eq.${encodeURIComponent(leagueId)}&select=player_name,dupr_id`, { headers:H() });
    if(!r.ok) return {};
    const map = {}; for(const row of await r.json()) map[row.player_name] = row.dupr_id; return map;
  }catch(e){ return {}; }
}

async function fetchSubmitted(){
  subMap = {};
  try{
    const rr = await fetch(`${SUPABASE_URL}/rest/v1/dupr_matches?select=*`, { headers:H() });
    if(rr.ok) for(const row of await rr.json()) subMap[row.identifier] = row;
  }catch(e){ /* ignore */ }
}

async function loadAll(){
  const wrap = document.getElementById('leagues-wrap');
  wrap.innerHTML = '<div class="section"><p class="muted">Loading every league…</p></div>';
  await loadSeasons();
  if(currentSeason) { try{ await buildFullNameMap(currentSeason.id); }catch(e){} }
  await loadAdminDuprId();
  await fetchSubmitted();

  const sLabel = document.getElementById('season-label');
  if(sLabel && currentSeason) sLabel.textContent = `Season: ${currentSeason.name}. All completed matches across every league — submit, update, or remove in DUPR.`;

  PAGE = {};
  const leagues = seasonLeagues(currentSeason).filter(lg => lg.duprEnabled !== false);
  for(const lg of leagues){
    let sched = [];
    try{ const res = await dbGet(seasonKey(lg.key, currentSeason.id)); sched = (res.data && res.data.schedule) || []; }catch(e){}
    const idMap = await leagueDuprIds(lg.id);
    const matches = [];
    for(const w of sched){
      (w.matches || []).forEach((m, idx) => {
        const r = seriesResult(m);
        if(!r.complete) return;
        const matchNum = idx + 1;
        const isD = m.p1a !== undefined;
        const names = isD ? [m.p1a,m.p1b,m.p2a,m.p2b].filter(Boolean) : [m.p1,m.p2].filter(Boolean);
        const label = isD
          ? `${displayName(m.p1a)} &amp; ${displayName(m.p1b)} vs ${displayName(m.p2a)} &amp; ${displayName(m.p2b)}`
          : `${displayName(m.p1)} vs ${displayName(m.p2)}`;
        const scores = (m.games || []).filter(g => g.s1!=null && g.s2!=null).map(g => `${g.s1}-${g.s2}`).join(', ');
        matches.push({
          week:w.week, matchNum,
          identifier:`${lg.key}|${currentSeason.id}|w${w.week}|m${matchNum}`,
          label, scores, series:r.seriesStr,
          linked: names.every(n => idMap[n]),
        });
      });
    }
    PAGE[lg.id] = { league:lg, schedule:sched, idMap, matches, duprEnabled: lg.duprEnabled !== false };
  }

  await loadTournamentMatches();
  render();
}

// Build DUPR-page entries for tournament pool + bracket matches, so completed
// tournament games show up right alongside league matches for submission.
async function loadTournamentMatches(){
  let cat = [];
  try{ const res = await dbGet('nac_tournaments'); cat = (res.data && res.data.tournaments) || []; }catch(e){ return; }

  for(const t of cat){
    for(const d of (t.divisions || [])){
      if(d.duprEnabled === false) continue;   // this division doesn't count for DUPR
      let DIV = null;
      try{ const r = await dbGet(`tourney_${t.id}_${d.id}`); DIV = (r.data && r.data.teams) ? r.data : null; }catch(e){}
      if(!DIV || !DIV.teams || !DIV.teams.length) continue;

      // Seed the display-name map from this division's registrations so any
      // team names still stored as "First L." render as full names.
      try{
        const lmN = await fetch(`${SUPABASE_URL}/rest/v1/league_members?league_id=eq.${encodeURIComponent('t:'+t.id+':'+d.id)}&status=eq.active&select=first_name,last_name`, { headers:H() });
        if(lmN.ok){ for(const r of await lmN.json()){
          const full = `${r.first_name||''} ${r.last_name||''}`.trim();
          const li = `${(r.first_name||'').trim()} ${((r.last_name||'').trim())[0]||''}.`.trim();
          if(full){ FULL_NAMES[full.toLowerCase()] = full; if(li) FULL_NAMES[li.toLowerCase()] = full; }
        }}
      }catch(e){}

      // teams[i].name is "Full Name" (singles) or "A & B" (doubles).
      const teamPlayers = DIV.teams.map(tm => (tm.name || '').split(' & ').map(x => x.trim()).filter(Boolean));

      // Prefer the DUPR ids stored on each team at "Load Registered" time — they
      // were captured with an admin session that could read profiles, so they
      // don't depend on this page's (anon) RLS access. Map player name -> id by
      // position within the team. Fall back to name-resolution for any gaps.
      const idMap = {};
      DIV.teams.forEach((tm, ti) => {
        const names = teamPlayers[ti] || [];
        const ids = tm.duprIds || [];
        names.forEach((n, k) => { if(ids[k]) idMap[n] = ids[k]; });
      });
      const anyMissing = DIV.teams.some((tm, ti) => (teamPlayers[ti]||[]).some(n => !idMap[n]));
      if(anyMissing){
        try{ const fallback = await tournamentDuprIds(t, d); Object.keys(fallback).forEach(n => { if(!idMap[n]) idMap[n] = fallback[n]; }); }catch(e){}
      }
      const isD = d.teamType === 'doubles';

      const pseudoKey = `t_${t.id}_${d.id}`;            // PAGE bucket id
      const leagueKey = `tourney|${t.id}|${d.id}`;      // DUPR identifier prefix + submit leagueKey
      const matches = [];
      const schedule = [];                              // matchFrom() reads .games from here

      const pushMatch = (t1, t2, games, tag, roundLabel) => {
        const comp = (games || []).filter(g => g && g.s1!=null && g.s2!=null);
        if(!comp.length) return;                        // only completed games
        const A = teamPlayers[t1] || [], B = teamPlayers[t2] || [];
        const m = isD
          ? { p1a:A[0], p1b:A[1], p2a:B[0], p2b:B[1], games: comp }
          : { p1:A[0], p2:B[0], games: comp };
        const matchNum = matches.length + 1;
        schedule.push({ week:1, matches:[m] });         // one match per pseudo-week
        const names = isD ? [A[0],A[1],B[0],B[1]].filter(Boolean) : [A[0],B[0]].filter(Boolean);
        const label = isD
          ? `${displayName(A[0])} &amp; ${displayName(A[1])} vs ${displayName(B[0])} &amp; ${displayName(B[1])}`
          : `${displayName(A[0])} vs ${displayName(B[0])}`;
        matches.push({
          week: matchNum, matchNum: 1,
          identifier: `${leagueKey}|${tag}`,
          label, scores: comp.map(g=>`${g.s1}-${g.s2}`).join(', '),
          series: roundLabel,
          linked: names.length && names.every(n => idMap[n]),
        });
      };

      // Pool matches
      (DIV.poolMatches || []).forEach((pm, i) => {
        pushMatch(pm.t1, pm.t2, pm.games, `pool${pm.pool}r${pm.round}g${i}`, `Pool ${String.fromCharCode(65+pm.pool)}`);
      });
      // Bracket matches (both teams present only)
      if(DIV.bracket){
        DIV.bracket.rounds.forEach((round, ri) => {
          round.forEach((bm, bi) => {
            if(bm.t1===null || bm.t2===null) return;
            pushMatch(bm.t1, bm.t2, [{s1:bm.s1, s2:bm.s2}], `r${ri}m${bi}`, teRoundName(DIV.bracket.size, ri, DIV.bracket.rounds.length));
          });
        });
      }

      if(matches.length){
        PAGE[pseudoKey] = {
          league: { id: pseudoKey, key: leagueKey, name: `🏆 ${t.name} — ${d.name}` },
          schedule, idMap, matches, isTournament: true, duprEnabled: d.duprEnabled !== false
        };
      }
    }
  }
}

// name -> DUPR id for a tournament division, from its registrations + profiles.
async function tournamentDuprIds(t, d){
  const map = {};
  try{
    const lm = await fetch(`${SUPABASE_URL}/rest/v1/league_members?league_id=eq.${encodeURIComponent('t:'+t.id+':'+d.id)}&status=eq.active&select=user_id,first_name,last_name`, { headers:H() });
    const rows = lm.ok ? await lm.json() : [];
    const uids = [...new Set(rows.map(r=>r.user_id).filter(Boolean))];
    if(!uids.length) return map;
    const pr = await fetch(`${SUPABASE_URL}/rest/v1/profiles?id=in.(${uids.map(encodeURIComponent).join(',')})&select=id,first_name,last_name,dupr_id`, { headers:H() });
    const profs = pr.ok ? await pr.json() : [];
    profs.forEach(p => { if(p.dupr_id){ map[deriveScheduleName(p.first_name, p.last_name)] = p.dupr_id; } });
  }catch(e){ console.warn('tournamentDuprIds failed', e); }
  return map;
}

function render(){
  const wrap = document.getElementById('leagues-wrap');
  const leagues = Object.values(PAGE);
  const total = leagues.reduce((a,l)=>a+l.matches.length,0);
  const submitted = leagues.reduce((a,l)=>a+l.matches.filter(m=>{const s=subMap[m.identifier];return s&&s.status!=='deleted'&&s.match_code;}).length,0);
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-sub').textContent = submitted;
  document.getElementById('stat-pending').textContent = total - submitted;

  const withMatches = leagues.filter(l => l.matches.length);
  if(!withMatches.length){
    wrap.innerHTML = '<div class="section"><p class="muted">No completed matches in any league yet. Once players finish a series, it appears here to submit to DUPR.</p></div>';
    return;
  }
  wrap.innerHTML = withMatches.map(renderLeague).join('');
}

function effectiveSub(baseId){
  // A schedule match may have a base submission plus versioned resubmissions
  // (baseId-r1, -r2 …). Prefer the newest ACTIVE row; else the newest deleted.
  const keys = Object.keys(subMap).filter(k => k === baseId || k.startsWith(baseId + '-r'));
  if(!keys.length) return null;
  const rows = keys.map(k => ({ ...subMap[k], identifier: k }));
  const active = rows.filter(r => r.status !== 'deleted');
  const pick = (active.length ? active : rows)
    .sort((a,b) => new Date(a.submitted_at||0) - new Date(b.submitted_at||0));
  return pick[pick.length - 1];
}
function nextResubmitVersion(baseId){
  const vers = Object.keys(subMap)
    .filter(k => k.startsWith(baseId + '-r'))
    .map(k => parseInt(k.slice((baseId + '-r').length), 10))
    .filter(n => !isNaN(n));
  return (vers.length ? Math.max(...vers) : 0) + 1;
}

function renderLeague(l){
  const rows = l.matches.map(c => {
    const sub = effectiveSub(c.identifier);
    const deleted = sub && sub.status === 'deleted';
    const done = sub && sub.status !== 'deleted' && sub.match_code;
    const dis = c.linked ? '' : 'disabled title="A player is not DUPR-linked"';
    let status, actions;
    if(done){
      const idAttr = sub.identifier.replace(/'/g,"\\'");
      status = `<span class="badge ok">submitted</span> <code>${sub.match_code}</code>`;
      actions = `<button class="btn-sm ghost" onclick="doUpdate('${l.league.id}','${idAttr}',${c.week},${c.matchNum})">Update</button>`
              + `<button class="btn-sm danger" onclick="doDelete('${idAttr}')">Delete</button>`;
    } else if(deleted){
      status = '<span class="badge del">deleted</span>';
      actions = `<button class="btn-sm green" ${dis} title="Push a fresh copy to DUPR under a new id" onclick="doResubmitNew('${l.league.id}',${c.week},${c.matchNum})">Resubmit as new</button>`;
    } else {
      status = '<span class="badge pend">not submitted</span>';
      actions = `<button class="btn-sm green" ${dis} onclick="doSubmit('${l.league.id}',${c.week},${c.matchNum})">Submit</button>`;
    }
    return `<tr>
      <td class="nw"><strong>Wk ${c.week} · M${c.matchNum}</strong></td>
      <td>${c.label}</td>
      <td class="nw">${done
        ? `<a href="${DUPR_MATCH_URL(sub.match_id || sub.match_code)}" target="_blank" rel="noopener" title="Open this match on DUPR" style="color:var(--green-dark);text-decoration:underline">${c.scores || c.series}</a>`
        : (c.scores || c.series)}${c.scores ? ` <span class="muted sm">(${c.series})</span>` : ''}</td>
      <td>${status}</td>
      <td class="nw ar">${actions}</td>
    </tr>`;
  }).join('');
  return `<div class="section">
    <div class="lg-head"><h2>${l.league.name}</h2><span class="count-pill">${l.matches.length} match${l.matches.length!==1?'es':''}</span></div>
    <div class="table-wrap"><table class="m">
      <thead><tr><th>Week / Match</th><th>Matchup</th><th>Result</th><th>DUPR Status</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>`;
}

function buildBody(m, idMap){
  const isD = m.p1a !== undefined;
  const format = isD ? 'DOUBLES' : 'SINGLES';
  const names = isD ? [m.p1a,m.p1b,m.p2a,m.p2b].filter(Boolean) : [m.p1,m.p2].filter(Boolean);
  if(!names.every(n => idMap[n])) return null;
  const teamA = isD ? { player1:idMap[m.p1a], player2:idMap[m.p1b] } : { player1:idMap[m.p1] };
  const teamB = isD ? { player1:idMap[m.p2a], player2:idMap[m.p2b] } : { player1:idMap[m.p2] };
  const comp = (m.games || []).filter(g => g.s1!=null && g.s2!=null);
  if(!comp.length) return null;
  comp.forEach((g,i) => { teamA[`game${i+1}`] = g.s1; teamB[`game${i+1}`] = g.s2; });
  return { match:{ teamA, teamB }, format };
}

async function callFn(name, body){
  const r = await fetch(`${SUPABASE_URL}/functions/v1/${name}`, {
    method:'POST', headers:{ 'Content-Type':'application/json', ...H() }, body: JSON.stringify(body)
  });
  return await r.json().catch(()=>({}));
}

function matchFrom(leagueId, week, matchNum){
  const P = PAGE[leagueId]; if(!P) return null;
  const wk = P.schedule.find(w => w.week === week);
  return wk ? wk.matches[matchNum-1] : null;
}

async function doSubmit(leagueId, week, matchNum, idSuffix){
  const P = PAGE[leagueId];
  const m = matchFrom(leagueId, week, matchNum);
  if(!m){ toast('Match not found'); return; }
  if(!adminDuprId){ toast('Connect your DUPR admin account (Dashboard) before submitting'); return; }
  const body = buildBody(m, P.idMap);
  if(!body){ toast('Cannot submit — a player is unlinked or the score is incomplete'); return; }

  // Guard against DUPR's "missing player or same player in both teams" error:
  // map each roster slot to its resolved DUPR id and check for blanks/duplicates.
  const isD = m.p1a !== undefined;
  const slots = isD
    ? [['p1a',m.p1a],['p1b',m.p1b],['p2a',m.p2a],['p2b',m.p2b]]
    : [['p1',m.p1],['p2',m.p2]];
  const resolved = slots.filter(([k,n]) => n).map(([k,n]) => ({ name:n, id:P.idMap[n] }));
  const missing = resolved.filter(r => !r.id);
  if(missing.length){
    console.warn('DUPR submit — unresolved players:', missing, 'idMap:', P.idMap);
    toast('Not linked to DUPR: ' + missing.map(r=>r.name).join(', '));
    return;
  }
  const seen = {};
  const collided = [];
  resolved.forEach(r => { if(seen[r.id]) collided.push(`${seen[r.id]} & ${r.name}`); else seen[r.id] = r.name; });
  if(collided.length){
    console.warn('DUPR submit — two players share one DUPR id:', collided, 'resolved:', resolved, 'idMap:', P.idMap);
    toast('These players share the same DUPR account (fix their dupr_players entries): ' + collided.join(', '));
    return;
  }

  toast(idSuffix ? 'Resubmitting to DUPR as a new match…' : 'Submitting to DUPR…');
  const row = P.matches.find(x => x.week === week && x.matchNum === matchNum);
  const d = await callFn('dupr-submit-match', {
    match: body.match, format: body.format,
    leagueKey: P.league.key, leagueName: P.league.name,
    seasonId: currentSeason.id, week, matchNum, submitterDuprId: adminDuprId,
    identifier: row ? row.identifier : undefined,   // tournaments carry a custom id
    duprEnabled: P.duprEnabled,
    idSuffix: idSuffix || undefined,
  });
  if(!d.success) console.error('DUPR SUBMIT failed:', d);
  toast(d.success ? (d.updated ? 'Match updated in DUPR' : 'Submitted to DUPR') : (d.ineligible ? ('Blocked: missing BASIC_L1 — ' + d.ineligible.join(', ')) : ((d.error || 'Submission failed') + (d.details ? ' — ' + d.details : ''))));
  await loadAll();
}

// Resubmit a previously-deleted match as a fresh DUPR match (new identifier).
async function doResubmitNew(leagueId, week, matchNum){
  const baseId = `${PAGE[leagueId].league.key}|${currentSeason.id}|w${week}|m${matchNum}`;
  const v = nextResubmitVersion(baseId);
  await doSubmit(leagueId, week, matchNum, 'r' + v);
}

async function doUpdate(leagueId, identifier, week, matchNum){
  const P = PAGE[leagueId];
  const m = matchFrom(leagueId, week, matchNum);
  if(!m){ toast('Match not found'); return; }
  const body = buildBody(m, P.idMap);
  if(!body){ toast('Cannot update — player unlinked or score incomplete'); return; }
  toast('Updating in DUPR…');
  const d = await callFn('dupr-update-match', { identifier, match: body.match, format: body.format, leagueName: P.league.name, week });
  if(!d.success) console.error('DUPR UPDATE failed:', d);
  toast(d.success ? 'Match updated in DUPR' : ((d.error || 'Update failed') + (d.details ? ' — ' + d.details : '')));
  await loadAll();
}

async function doDelete(identifier){
  if(!confirm('Delete this match from DUPR? This removes the result from the DUPR history of everyone in it.')) return;
  toast('Deleting from DUPR…');
  const d = await callFn('dupr-delete-match', { identifier });
  if(!d.success) console.error('DUPR DELETE failed:', d);
  toast(d.success ? 'Match deleted from DUPR' : (d.error || 'Delete failed'));
  await loadAll();
}
</script>
