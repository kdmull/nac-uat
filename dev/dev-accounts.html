<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpg" href="favicon.jpg"/>
<title>Accounts — NAC Pickleball Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2a6c;--navy-dark:#111d4e;
  --green:#4caf28;--green-dark:#3a8c1e;
  --white:#ffffff;--off-white:#f4f7fb;
  --surface:#f0f4f9;--surface2:#e3eaf4;
  --text:#1a2a6c;--muted:#5a6a9a;--border:rgba(26,42,108,0.12);
  --danger:#d93b3b;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
  --radius:8px;--radius-lg:12px;
}
body{background:var(--off-white);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;-webkit-text-size-adjust:100%}
nav{background:var(--navy);padding:0 1.5rem;display:flex;align-items:center;border-bottom:3px solid var(--green)}
.nav-brand{display:flex;align-items:center;gap:12px;padding:.65rem 0;margin-right:auto;text-decoration:none}
.nav-logo{height:44px;width:auto}
.nav-link{color:rgba(255,255,255,.7);font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-decoration:none;padding:.7rem 0;margin-left:1.2rem}
.nav-link:hover{color:var(--white)}
.page{padding:2rem 1.5rem;max-width:1100px;margin:0 auto}
.section{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;box-shadow:0 1px 4px rgba(26,42,108,.06);margin-bottom:1.5rem}
.section-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem}
.section-header h2{font-family:var(--font-display);font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);line-height:1}
.section-header p{color:var(--muted);font-size:13px}
/* Gate */
.admin-gate{text-align:center;padding:3rem 1rem}
.admin-gate h3{font-family:var(--font-display);font-size:24px;font-weight:900;text-transform:uppercase;color:var(--navy);margin-bottom:.5rem}
.admin-gate p{color:var(--muted);margin-bottom:1.5rem}
.admin-gate input{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px 16px;font-size:16px;width:220px;outline:none;margin-right:8px;font-family:var(--font-body)}
.admin-gate input:focus{border-color:var(--navy)}
.admin-gate .err{color:var(--danger);font-size:13px;margin-top:8px;min-height:18px}
.btn{padding:10px 20px;border-radius:var(--radius);font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .12s;border:1.5px solid transparent}
.btn-primary{background:var(--navy);color:var(--white);border-color:var(--navy)}.btn-primary:hover{background:var(--navy-dark)}
/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;box-shadow:0 1px 3px rgba(26,42,108,.05)}
.stat-card .v{font-family:var(--font-display);font-size:32px;font-weight:900;color:var(--navy);line-height:1}
.stat-card .l{font-family:var(--font-display);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-top:4px}
/* Toolbar */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:1rem;flex-wrap:wrap}
.search-input{flex:1;min-width:200px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:10px 14px;font-size:15px;font-family:var(--font-body);color:var(--text);outline:none}
.search-input:focus{border-color:var(--navy);background:var(--white)}
.count-pill{font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
/* Table */
.table-wrap{overflow-x:auto}
.acct-table{width:100%;border-collapse:collapse;min-width:680px}
.acct-table th{font-family:var(--font-display);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:10px 12px;text-align:left;border-bottom:2px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
.acct-table th:hover{color:var(--navy)}
.acct-table th .arrow{opacity:.5;font-size:10px}
.acct-table td{padding:11px 12px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.acct-table tbody tr:last-child td{border-bottom:none}
.acct-table tbody tr:hover{background:var(--surface)}
.name-cell{font-weight:600;color:var(--navy)}
.admin-tag{font-family:var(--font-display);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);background:var(--surface2);padding:1px 7px;border-radius:4px;margin-left:6px}
.muted{color:var(--muted)}
.badge{display:inline-block;font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 9px;border-radius:4px}
.badge.linked{color:var(--green-dark);background:rgba(76,175,40,.12)}
.badge.unlinked{color:var(--muted);background:var(--surface2)}
.badge.league{color:var(--navy);background:rgba(26,42,108,.08)}
.badge.none{color:var(--muted);background:transparent;padding-left:0}
.loading,.empty{text-align:center;padding:3rem;color:var(--muted);font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.notice{background:rgba(217,59,59,.07);border:1px solid rgba(217,59,59,.25);border-radius:var(--radius);padding:12px 14px;font-size:13px;color:var(--danger);margin-bottom:1rem}
@media(max-width:600px){
  .page{padding:1rem}.stats-row{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat-card{padding:.8rem}.stat-card .v{font-size:24px}.stat-card .l{font-size:10px}
  .admin-gate input{width:100%;margin-right:0;margin-bottom:8px}
}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="dev-index.html"><img src="naclogo.png" class="nav-logo" alt="NAC"/></a>
  <a class="nav-link" href="dev-admin.html">Admin</a>
  <a class="nav-link" href="dev-index.html">Leagues</a>
</nav>

<div class="page" id="page">
  <!-- Password gate (shown unless logged in as an admin account) -->
  <div class="section" id="gate-section" style="display:none">
    <div class="admin-gate">
      <h3>Accounts</h3>
      <p>Enter your admin password to view registered accounts</p>
      <div>
        <input type="password" id="admin-pw" placeholder="Password" onkeydown="if(event.key==='Enter')checkAdmin()"/>
        <button class="btn btn-primary" onclick="checkAdmin()">Unlock</button>
      </div>
      <div class="err" id="admin-err"></div>
    </div>
  </div>

  <!-- Accounts panel -->
  <div id="panel" style="display:none">
    <div class="section-header">
      <h2>Accounts</h2>
      <p id="season-label"></p>
    </div>
    <div class="stats-row" id="stats"></div>
    <div class="section">
      <div class="toolbar">
        <input class="search-input" id="search" placeholder="Search by name or email…" oninput="renderRows()"/>
        <span class="count-pill" id="count"></span>
      </div>
      <div id="table-host">
        <div class="loading"><span class="spinner"></span>Loading accounts…</div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared-dev.js"></script>
<script>
const sbAuth = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LEAGUE_NAMES = {
  beginner:'All Ages Beginner', int1949:'19-49 Intermediate', int50:'50+ Intermediate',
  adv1949:'19-49 Advanced', adv50:'50+ Advanced', singles:'Singles League'
};

let accounts = [];          // merged profile + league rows
let sortKey = 'name';
let sortDir = 1;            // 1 asc, -1 desc
let loadNotice = '';

// ---- Auth gate (mirrors dev-admin.html) ----
async function isAdminAccount(){
  try{
    const { data:{ session } } = await sbAuth.auth.getSession();
    if(!session) return false;
    const { data } = await sbAuth.from('profiles').select('is_admin').eq('id', session.user.id).single();
    return !!(data && data.is_admin);
  }catch(e){ return false; }
}
function checkAdmin(){
  const pw = document.getElementById('admin-pw').value;
  if(pw === ADMIN_PW){ unlock(); }
  else { document.getElementById('admin-err').textContent = 'Incorrect password'; }
}
function unlock(){
  document.getElementById('gate-section').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  loadAccounts();
}

window.addEventListener('DOMContentLoaded', async () => {
  if(await isAdminAccount()) unlock();
  else document.getElementById('gate-section').style.display = 'block';
});

// ---- Data ----
async function loadAccounts(){
  loadNotice = '';
  try{
    await loadSeasons();   // shared-dev.js -> currentSeason
    const seasonId = currentSeason?.id || 'spring2026';
    document.getElementById('season-label').textContent =
      `League column reflects ${currentSeason?.name || seasonId}`;

    const { data: profiles, error: pErr } = await sbAuth
      .from('profiles')
      .select('id,first_name,last_name,email,phone,dupr_id,is_admin');
    if(pErr) throw pErr;

    const { data: members, error: mErr } = await sbAuth
      .from('league_members')
      .select('user_id,league_id,partner_name,status')
      .eq('season_id', seasonId)
      .eq('status', 'active');
    if(mErr) console.warn('league_members read failed:', mErr);

    const byUser = {};
    (members || []).forEach(m => { byUser[m.user_id] = m; });

    accounts = (profiles || []).map(p => {
      const m = byUser[p.id];
      return {
        id: p.id,
        name: `${p.first_name||''} ${p.last_name||''}`.trim() || '(no name)',
        first: p.first_name || '', last: p.last_name || '',
        email: p.email || '',
        phone: p.phone || '',
        duprId: p.dupr_id || '',
        isAdmin: !!p.is_admin,
        leagueId: m ? m.league_id : '',
        partner: m ? (m.partner_name || '') : ''
      };
    });

    // If we can only see our own profile, RLS is blocking the full read.
    if(accounts.length <= 1){
      loadNotice = 'Only your own account is visible. The profiles table is likely restricting reads to the signed-in user (row-level security). To list every account here, profiles needs to allow admin reads — I can set that up with a secure server-side function if you want.';
    }

    renderStats();
    renderRows();
  }catch(e){
    console.error('Failed to load accounts:', e);
    document.getElementById('table-host').innerHTML =
      `<div class="empty">Couldn't load accounts — ${e.message||'unknown error'}</div>`;
  }
}

// ---- Render ----
function renderStats(){
  const total = accounts.length;
  const registered = accounts.filter(a => a.leagueId).length;
  const linked = accounts.filter(a => a.duprId).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card"><div class="v">${total}</div><div class="l">Total Accounts</div></div>
    <div class="stat-card"><div class="v">${registered}</div><div class="l">Registered</div></div>
    <div class="stat-card"><div class="v">${linked}</div><div class="l">DUPR Linked</div></div>`;
}

function setSort(key){
  if(sortKey === key) sortDir = -sortDir;
  else { sortKey = key; sortDir = 1; }
  renderRows();
}

function renderRows(){
  const host = document.getElementById('table-host');
  const q = (document.getElementById('search').value || '').trim().toLowerCase();

  let rows = accounts.filter(a =>
    !q || a.name.toLowerCase().includes(q) || a.email.toLowerCase().includes(q));

  rows.sort((a,b) => {
    let av, bv;
    switch(sortKey){
      case 'email':   av=a.email;   bv=b.email;   break;
      case 'dupr':    av=a.duprId?'1':'0'; bv=b.duprId?'1':'0'; break;
      case 'league':  av=LEAGUE_NAMES[a.leagueId]||''; bv=LEAGUE_NAMES[b.leagueId]||''; break;
      default:        av=(a.last+' '+a.first).toLowerCase(); bv=(b.last+' '+b.first).toLowerCase();
    }
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });

  document.getElementById('count').textContent =
    `${rows.length} of ${accounts.length}`;

  const arrow = k => sortKey===k ? `<span class="arrow">${sortDir>0?'▲':'▼'}</span>` : '';
  const noticeHtml = loadNotice ? `<div class="notice">${loadNotice}</div>` : '';

  if(!rows.length){
    host.innerHTML = noticeHtml + `<div class="empty">No accounts match.</div>`;
    return;
  }

  host.innerHTML = noticeHtml + `
    <div class="table-wrap">
      <table class="acct-table">
        <thead><tr>
          <th onclick="setSort('name')">Player ${arrow('name')}</th>
          <th onclick="setSort('email')">Email ${arrow('email')}</th>
          <th>Phone</th>
          <th onclick="setSort('dupr')">DUPR ${arrow('dupr')}</th>
          <th onclick="setSort('league')">League (this season) ${arrow('league')}</th>
        </tr></thead>
        <tbody>
          ${rows.map(a => `
            <tr>
              <td class="name-cell">${a.name}${a.isAdmin?'<span class="admin-tag">Admin</span>':''}</td>
              <td>${a.email ? a.email : '<span class="muted">—</span>'}</td>
              <td>${a.phone ? a.phone : '<span class="muted">—</span>'}</td>
              <td>${a.duprId
                ? `<span class="badge linked">${a.duprId}</span>`
                : `<span class="badge unlinked">Not linked</span>`}</td>
              <td>${a.leagueId
                ? `<span class="badge league">${LEAGUE_NAMES[a.leagueId]||a.leagueId}</span>${a.partner?` <span class="muted">+ ${a.partner}</span>`:''}`
                : `<span class="badge none muted">—</span>`}</td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}
</script>
</body>
</html>
