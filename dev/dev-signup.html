<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpg" href="favicon.jpg"/>
<title>League Registration — NAC Pickleball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1a2a6c;--navy-dark:#111d4e;
  --green:#4caf28;--green-dark:#3a8c1e;
  --white:#ffffff;--off-white:#f4f7fb;
  --surface:#f0f4f9;--surface2:#e3eaf4;
  --text:#1a2a6c;--muted:#5a6a9a;--border:rgba(26,42,108,0.12);
  --danger:#d93b3b;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
  --radius:8px;--radius-lg:12px;
}
body{background:var(--off-white);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh;-webkit-text-size-adjust:100%}
nav{background:var(--navy);padding:0 max(1.5rem,env(safe-area-inset-right)) 0 max(1.5rem,env(safe-area-inset-left));display:flex;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:100;border-bottom:3px solid var(--green)}
.nav-brand{display:flex;align-items:center;gap:12px;padding:.65rem 0;margin-right:1.2rem;text-decoration:none}
.nav-logo{height:44px;width:auto}
.nav-link{padding:1rem .95rem;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(255,255,255,.6);text-decoration:none;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap;cursor:pointer}
.nav-link:hover{color:#fff}
.nav-link.current{color:var(--green);border-bottom-color:var(--green)}
.nav-actions{display:flex;align-items:center;flex-wrap:wrap}
.nav-right{display:flex;align-items:center;flex-wrap:wrap;margin-left:auto}
.nav-btn{font-family:var(--font-display);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:7px 14px;border-radius:var(--radius);cursor:pointer;text-decoration:none;transition:all .12s;border:1.5px solid transparent;white-space:nowrap}
.nav-btn-ghost{color:#fff;border-color:rgba(255,255,255,.4)}
.nav-btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.nav-btn-solid{background:var(--green);color:#fff;border-color:var(--green)}
.nav-btn-solid:hover{background:var(--green-dark);border-color:var(--green-dark)}
.page{padding:2rem 1.5rem;max-width:560px;margin:0 auto}
.page-header{text-align:center;margin-bottom:2rem}
.page-header h1{font-family:var(--font-display);font-size:32px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--navy);margin-bottom:.4rem}
.page-header p{color:var(--muted);font-size:15px}
.leagues-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:2rem}
.league-card{background:var(--white);border:2px solid var(--border);border-radius:var(--radius-lg);padding:1.2rem;cursor:pointer;transition:all .15s;text-align:left;position:relative}
.league-card:hover{border-color:var(--navy);box-shadow:0 4px 16px rgba(26,42,108,.1)}
.league-card.selected{border-color:var(--green);background:rgba(76,175,40,.04)}
.league-card-title{font-family:var(--font-display);font-size:17px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
.league-card-sub{font-size:13px;color:var(--muted);margin-top:3px}
.dupr-chip{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-display);font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--green-dark,#3a8c1e);padding:2px 7px;border-radius:4px;vertical-align:middle;margin-left:6px;text-transform:uppercase}
.dupr-chip .dot{width:5px;height:5px;border-radius:50%;background:#fff;display:inline-block}
.league-card-type{display:inline-block;margin-top:8px;font-family:var(--font-display);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 8px;border-radius:4px}
.type-individual{background:rgba(77,184,232,.15);color:#2a7fa8}
.type-partner{background:rgba(168,130,255,.15);color:#7a4fd4}
.league-card-check{display:none;position:absolute;top:1.2rem;right:1.2rem;font-size:18px;color:var(--green)}
.league-card.selected .league-card-check{display:inline}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;box-shadow:0 1px 4px rgba(26,42,108,.06)}
.card h2{font-family:var(--font-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:1.5rem;padding-bottom:.75rem;border-bottom:2px solid var(--green)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.info-row:last-child{border-bottom:none}
.info-row .lbl{color:var(--muted);font-family:var(--font-display);text-transform:uppercase;font-size:12px;letter-spacing:.5px}
.info-row .val{font-weight:600;color:var(--navy)}
.form-group{display:flex;flex-direction:column;gap:5px;margin:1rem 0}
.form-group label{font-size:12px;font-family:var(--font-display);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
.form-group input,.form-group select{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);padding:10px 14px;font-size:16px;font-family:var(--font-body);outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--navy);background:var(--white)}
.selected-league-badge{display:flex;align-items:center;gap:8px;background:rgba(76,175,40,.08);border:1px solid rgba(76,175,40,.3);border-radius:var(--radius);padding:10px 14px;margin-bottom:1.5rem}
.selected-league-badge span{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--green-dark);text-transform:uppercase;letter-spacing:.5px}
.selected-league-badge button{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0}
.btn{padding:12px 24px;border-radius:var(--radius);font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .12s;border:1.5px solid transparent;width:100%}
.btn-primary{background:var(--navy);color:var(--white);border-color:var(--navy)}.btn-primary:hover{background:var(--navy-dark)}.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-green{background:var(--green);color:var(--white);border-color:var(--green)}
.success-wrap{display:none;text-align:center;padding:3rem 1rem}
.success-icon{font-size:56px;margin-bottom:1rem}
.success-wrap h2{font-family:var(--font-display);font-size:28px;font-weight:900;text-transform:uppercase;color:var(--green-dark);margin-bottom:.5rem}
.success-wrap p{color:var(--muted);font-size:15px;margin-bottom:1.5rem}
.gate{text-align:center;padding:3rem 1rem}
.gate h2{font-family:var(--font-display);font-size:24px;font-weight:800;text-transform:uppercase;color:var(--navy);margin-bottom:.5rem}
.gate p{color:var(--muted);margin-bottom:1.5rem}
.msg{font-size:13px;margin-top:10px;text-align:center;min-height:18px}
.msg.error{color:var(--danger)}.msg.success{color:var(--green-dark)}
.loading{text-align:center;padding:3rem;color:var(--muted);font-family:var(--font-display);text-transform:uppercase;letter-spacing:1px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .6s linear infinite;display:inline-block;margin-right:10px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--navy);color:var(--white);padding:10px 20px;border-radius:var(--radius);font-family:var(--font-display);font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.5px;transform:translateY(80px);opacity:0;transition:all .25s;z-index:9999;pointer-events:none;border-left:4px solid var(--green)}
.toast.show{transform:translateY(0);opacity:1}
@media(max-width:600px){.page{padding:1rem}.leagues-grid{grid-template-columns:1fr}.card{padding:1.2rem}}
/* --- mobile nav (responsive: logo centered on top, links centered below) --- */
@media(max-width:768px){
  nav{flex-wrap:wrap;justify-content:center}
  .nav-brand{width:100%;display:flex;justify-content:center;margin-right:0;padding:.5rem 0 .25rem}
  .nav-logo{height:56px}
  .nav-greeting{display:none}
  .nav-actions:empty{display:none}
  .nav-actions,.nav-right,[data-account-nav]{display:flex;width:100%;margin-left:0;justify-content:center;flex-wrap:wrap}
  .nav-link{flex:0 1 auto;padding:.7rem .6rem;font-size:13px;text-align:center;white-space:nowrap}
  [data-account-nav] a{padding:.7rem .6rem!important;font-size:13px!important;text-align:center}
}
@media(max-width:400px){
  .nav-link,[data-account-nav] a{font-size:11px!important;padding:.6rem .4rem!important}
}
</style>
</head>
<body>
<nav>
  <a class="nav-brand" href="dev-index.html"><img src="naclogo.png" class="nav-logo" alt="NAC"/></a>
  <div class="nav-actions" id="nav-actions"></div>
  <div class="nav-right" id="nav-links">
    <a class="nav-link" href="dev-index.html">Leagues</a>
    <a class="nav-link" href="dev-rules.html">Rules</a>
  </div>
</nav>

<div class="page" id="page">
  <div class="loading"><span class="spinner"></span>Loading...</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared-dev.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentUser = null;
let currentProfile = null;
let selectedLeague = null;
let activeSeasonId = 'spring2026';
let activeSeasonName = 'Spring 2026';
let seasonLeagueTypes = {}; // { leagueId: 'individual' | 'partner' }

window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  const navActions = document.getElementById('nav-actions');
  if(!session){
    if(navActions) navActions.innerHTML = `<a class="nav-link" href="dev-auth.html">Sign In</a>`;
    renderGate();
    return;
  }
  currentUser = session.user;
  if(navActions) navActions.innerHTML = `
    <a class="nav-link" href="dev-dashboard.html">My Profile</a>
    <a class="nav-link" href="#" onclick="doLogout();return false;">Sign Out</a>`;

  // Load profile
  const { data: prof } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  currentProfile = prof || { id: currentUser.id, email: currentUser.email };

  // HARD BLOCK: DUPR account must be linked before registering
  if(!currentProfile.dupr_id){
    renderDuprRequired();
    return;
  }

  // Load active season + per-league registration types
  await loadSeasonConfig();

  // Load any existing registration for this season
  await loadMyMembership();

  const activeSeason = allSeasons.find(s => s.id === activeSeasonId) || currentSeason;
  const regOpen = isRegistrationOpen(activeSeason);

  // If already registered this season, show the management view
  if(myMembership){
    renderMyRegistration(regOpen);
    return;
  }

  // Not registered yet — if registration is closed, show closed message
  if(!regOpen){
    renderClosed();
    return;
  }

  renderLeagueSelect();
});

let myMembership = null;
let switchMode = false;

async function loadMyMembership(){
  try{
    const { data, error } = await sb.from('league_members')
      .select('*')
      .eq('user_id', currentUser.id)
      .eq('season_id', activeSeasonId)
      .eq('status', 'active')
      .maybeSingle();
    if(error){ console.warn('membership load error:', error); myMembership = null; return; }
    myMembership = data || null;
  }catch(e){ console.warn('loadMyMembership failed:', e); myMembership = null; }
}

// League display names come from the shared catalog (custom leagues included).
const LEAGUE_NAMES = new Proxy({}, { get: (_, id) => leagueName(id) });

function renderMyRegistration(regOpen){
  switchMode = false;
  const m = myMembership;
  const leagueName = LEAGUE_NAMES[m.league_id] || m.league_id;
  const isPartner = leagueRegType(m.league_id) === 'partner';
  document.getElementById('page').innerHTML = `
    <div class="page-header">
      <h1>My Registration</h1>
      <p>${activeSeasonName}</p>
    </div>
    <div class="card">
      <div class="selected-league-badge">
        <span>${leagueName}${isPartner?' · Partner':' · Individual'}</span>
      </div>
      <div class="info-row"><span class="lbl">Status</span><span class="val">Registered</span></div>
      ${isPartner ? `<div class="info-row"><span class="lbl">Partner</span><span class="val">${m.partner_name||'—'}${m.partner_status==='pending'?' <span style="color:#b8860b;font-size:12px;font-weight:600">(pending acceptance)</span>':''}${m.partner_status==='accepted'&&m.partner_name?' <span style="color:var(--green-dark);font-size:12px;font-weight:600">✓</span>':''}</span></div>${m.partner_status==='declined'?'<p style="color:var(--danger);font-size:13px;margin-top:4px">Your previous partner invite was declined — choose a new partner below.</p>':''}` : ''}
      ${regOpen ? `
        <p style="font-size:13px;color:var(--muted);margin:1rem 0 .5rem">You can switch leagues or update your partner while registration is open.</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" style="width:auto;flex:1;min-width:140px" onclick="startSwitchLeague()">Switch League</button>
          ${isPartner ? `<button class="btn btn-green" style="width:auto;flex:1;min-width:140px" onclick="startEditPartner()">Edit Partner</button>` : ''}
        </div>
        <button class="btn" style="background:transparent;border-color:var(--border);color:var(--danger);margin-top:8px" onclick="leaveLeague()">Leave League</button>
      ` : `
        <p style="font-size:13px;color:var(--muted);margin-top:1rem">Registration is closed — your league is locked for this season.</p>
      `}
      <div class="msg" id="reg-msg"></div>
    </div>`;
}

function startSwitchLeague(){
  switchMode = true;
  renderLeagueSelect();
}

// Partner dropdown: hide players who already have an active registration in this
// same league/division — they're spoken for. Two exceptions stay visible:
//   • whoever is currently selected as my partner (so Edit Partner still shows them)
//   • anyone who picked ME as their partner (so I can reciprocate and pair up)
async function availablePartners(leagueId, seasonId, keepIds){
  const [profRes, regRes] = await Promise.all([
    sb.from('profiles').select('id,first_name,last_name').neq('id', currentUser.id),
    sb.from('league_members').select('user_id,partner_user_id')
      .eq('league_id', leagueId).eq('season_id', seasonId).eq('status','active')
  ]);
  const taken = new Set();
  (regRes.data || []).forEach(r => {
    if(r.user_id === currentUser.id) return;
    if(r.partner_user_id === currentUser.id) return;   // they invited me
    taken.add(r.user_id);
  });
  (keepIds || []).filter(Boolean).forEach(id => taken.delete(id));
  return (profRes.data || []).filter(p => !taken.has(p.id));
}

async function startEditPartner(){
  const m = myMembership;
  partnerOptions = await availablePartners(m.league_id, m.season_id, [m.partner_user_id]);
  document.getElementById('page').innerHTML = `
    <div class="page-header"><h1>Edit Partner</h1><p>${LEAGUE_NAMES[m.league_id]||m.league_id}</p></div>
    <div class="card">
      <div class="form-group">
        <label>Select Your Partner</label>
        <select id="partner-sel">
          <option value="">— Choose your partner —</option>
          ${partnerOptions.map(pp => `<option value="${pp.id}" ${pp.id===m.partner_user_id?'selected':''}>${pp.first_name||''} ${pp.last_name||''}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-green" onclick="savePartner()">Save Partner</button>
      <button class="btn" style="background:transparent;border-color:var(--border);color:var(--muted);margin-top:8px" onclick="renderMyRegistration(true)">Cancel</button>
      <div class="msg" id="reg-msg"></div>
    </div>`;
}

async function savePartner(){
  const sel = document.getElementById('partner-sel');
  const partnerUserId = sel.value || null;
  const pp = partnerOptions.find(x => x.id === partnerUserId);
  const partnerName = pp ? `${pp.first_name||''} ${pp.last_name||''}`.trim() : null;
  const msg = document.getElementById('reg-msg');

  // Mutual: they already invited me to this league — accept instead of re-inviting.
  if(partnerUserId){
    const mutual = await fetchInviteFrom(partnerUserId, myMembership.league_id);
    if(mutual){
      const ok = await respondPartnerInvite(partnerUserId, 'accept');
      if(!ok.success){ msg.className='msg error'; msg.textContent = ok.error || 'Could not accept invite.'; return; }
      myMembership.partner_user_id = partnerUserId;
      myMembership.partner_name = partnerName;
      myMembership.partner_status = 'accepted';
      showToast('Partners confirmed — they had already chosen you!');
      renderMyRegistration(true);
      return;
    }
  }

  const { error } = await sb.from('league_members')
    .update({ partner_user_id: partnerUserId, partner_name: partnerName, partner_status: partnerUserId ? 'pending' : null })
    .eq('id', myMembership.id);
  if(error){ msg.className='msg error'; msg.textContent = error.message; return; }
  myMembership.partner_user_id = partnerUserId;
  myMembership.partner_name = partnerName;
  myMembership.partner_status = partnerUserId ? 'pending' : null;
  showToast(partnerUserId ? 'Partner invited — pending their acceptance' : 'Partner removed');
  renderMyRegistration(true);
}

async function leaveLeague(){
  if(!confirm('Leave ' + (LEAGUE_NAMES[myMembership.league_id]||'this league') + '? You can register for a different league afterward.')) return;
  const { error } = await sb.from('league_members').delete().eq('id', myMembership.id);
  if(error){ showToast('Could not leave: ' + error.message); return; }
  myMembership = null;
  showToast('You have left the league');
  renderLeagueSelect();
}

function renderClosed(){
  document.getElementById('page').innerHTML = `
    <div class="gate">
      <h2>Registration Closed</h2>
      <p>Registration for ${activeSeasonName} is closed.${currentProfile?' Check your dashboard for leagues you\'re in.':''}</p>
      <a class="btn btn-primary" href="dev-dashboard.html" style="display:inline-block;text-decoration:none;max-width:280px">My Dashboard</a>
    </div>`;
}

function renderDuprRequired(){
  document.getElementById('page').innerHTML = `
    <div class="gate">
      <h2>Connect DUPR First</h2>
      <p>You must link your DUPR account before registering for a league. It only takes a moment.</p>
      <a class="btn btn-green" href="dupr-connect.html?returnTo=dev-signup.html" style="display:inline-block;text-decoration:none;max-width:280px">Connect DUPR Account</a>
    </div>`;
}

async function loadSeasonConfig(){
  try{
    await loadLeagues();   // shared-dev.js: catalog from DB (fallback to defaults)
    const r = await dbGet('nac_seasons');
    if(r && r.data){
      activeSeasonId = r.data.active || 'spring2026';
      allSeasons = r.data.seasons || [];
      const s = allSeasons.find(x => x.id === activeSeasonId);
      if(s){
        currentSeason = s;
        activeSeasonName = s.name;
        seasonLeagueTypes = s.leagueTypes || {};
      }
    }
  }catch(e){ console.warn('Season config load failed:', e); }
}

function leagueRegType(leagueId){
  return seasonLeagueTypes[leagueId] || 'individual';
}

function renderGate(){
  document.getElementById('page').innerHTML = `
    <div class="gate">
      <h2>Sign In Required</h2>
      <p>You need an account to register for a league.</p>
      <a class="btn btn-primary" href="dev-auth.html" style="display:inline-block;text-decoration:none;max-width:280px">Sign In or Create Account</a>
    </div>`;
}

function renderLeagueSelect(){
  const leagues = (typeof seasonLeagues === 'function' && currentSeason)
    ? seasonLeagues(currentSeason)
    : LEAGUES;
  document.getElementById('page').innerHTML = `
    <div class="page-header">
      <h1>${switchMode ? 'Switch League' : 'League Registration'}</h1>
      <p>${activeSeasonName} — ${switchMode ? 'pick a different league' : 'select a league to join'}</p>
    </div>
    ${switchMode ? '<p style="text-align:center;margin-bottom:1rem"><button class="btn" style="background:transparent;border:1.5px solid var(--border);color:var(--muted);width:auto;padding:6px 16px" onclick="renderMyRegistration(true)">← Cancel</button></p>' : ''}
    <div class="leagues-grid">
      ${leagues.filter(l => !(switchMode && myMembership && l.id===myMembership.league_id)).map(l => {
        const type = leagueRegType(l.id);
        return `<div class="league-card" onclick='selectLeague(${JSON.stringify(l).replace(/'/g,"&#39;")})'>
          <span class="league-card-check">✓</span>
          <div class="league-card-title">${l.name}${l.duprEnabled!==false?' <span class="dupr-chip" title="Matches in this league count toward your DUPR rating"><span class="dot"></span>DUPR</span>':''}</div>
          <div class="league-card-sub">${l.sub}</div>
          <span class="league-card-type ${type==='partner'?'type-partner':'type-individual'}">${type==='partner'?'Partner Signup':'Individual'}</span>
        </div>`;
      }).join('')}
    </div>`;
}

let partnerOptions = [];

async function selectLeague(league){
  selectedLeague = league;
  const type = leagueRegType(league.id);
  const p = currentProfile;

  // If partner league, load other registered/available players for selection
  let partnerSection = '';
  if(type === 'partner'){
    // Available partners only (excludes players already registered in this league)
    partnerOptions = await availablePartners(selectedLeague.id, currentSeason.id, []);
    partnerSection = `
      <div class="form-group">
        <label>Select Your Partner</label>
        <select id="partner-sel">
          <option value="">— Choose your partner —</option>
          ${partnerOptions.map(pp => `<option value="${pp.id}">${pp.first_name||''} ${pp.last_name||''}</option>`).join('')}
        </select>
        <p style="font-size:12px;color:var(--muted);margin-top:4px">Your partner must have an account. Ask them to sign up first if they're not listed.</p>
      </div>`;
  }

  document.getElementById('page').innerHTML = `
    <div class="page-header">
      <h1>Confirm Registration</h1>
      <p>${activeSeasonName}</p>
    </div>
    <div class="card">
      <div class="selected-league-badge">
        <span>${league.name}${league.duprEnabled!==false?' <span class="dupr-chip"><span class="dot"></span>DUPR</span>':''}${type==='partner'?' · Partner':' · Individual'}</span>
        <button onclick="renderLeagueSelect()" title="Change league">✕</button>
      </div>
      <h2 style="font-size:18px">Your Info</h2>
      <div class="info-row"><span class="lbl">Name</span><span class="val">${p.first_name||''} ${p.last_name||''}</span></div>
      <div class="info-row"><span class="lbl">Email</span><span class="val">${p.email||''}</span></div>
      <div class="info-row"><span class="lbl">Phone</span><span class="val">${p.phone||'—'}</span></div>
      ${!p.phone ? `<p style="font-size:13px;color:var(--danger);margin-top:8px">Please add your phone number on your <a href="dev-dashboard.html" style="color:var(--navy)">profile</a> first.</p>` : ''}
      ${partnerSection}
      <button class="btn btn-green" id="confirm-btn" onclick="confirmRegistration()" style="margin-top:1rem" ${!p.phone?'disabled':''}>Register for ${league.name}</button>
      <div class="msg" id="reg-msg"></div>
    </div>`;
}

// Fire-and-forget: alert a selected partner by email (server looks up their address).
function notifyPartner(partnerUserId, byName, league, status){
  if(!partnerUserId) return;
  try{
    fetch(`${SUPABASE_URL}/functions/v1/notify-email`, {
      method:'POST', keepalive:true,
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY },
      body: JSON.stringify({ type:'partner', data:{ partnerUserId, byName, league, status } })
    }).catch(()=>{});
  }catch(e){}
}

// Check a player's DUPR entitlements via the dupr-get-entitlements edge function.
// Returns {eligible, message}. Blocks on missing BASIC_L1, and (fail-open) when
// the eligibility check itself can't be reached.
async function verifyDuprEligibility(duprId, league){
  if(!duprId){
    return { eligible:false, message:'A linked DUPR account is required to register. Please connect DUPR from your dashboard first.' };
  }
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/dupr-get-entitlements`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY },
      body: JSON.stringify({ duprId })
    });
    const d = await res.json().catch(()=>({}));
    if(!res.ok){
      // We couldn't reach a working DUPR entitlements check (currently a
      // DUPR-side issue). Don't block registration on a verification outage —
      // allow it and log. Enforcement resumes automatically once the check
      // returns a real answer.
      console.warn('DUPR eligibility check unavailable — allowing registration:', d.error || res.status);
      return { eligible:true, unverified:true };
    }
    if(!d.basic){
      return { eligible:false, message:'Your DUPR account is not currently eligible for rated play (missing the BASIC_L1 entitlement). ' +
        'If you believe this is an error, please contact DUPR support.' };
    }
    return { eligible:true };
  }catch(e){
    // Network/unexpected error reaching the check — allow rather than block.
    console.warn('DUPR eligibility check error — allowing registration:', e);
    return { eligible:true, unverified:true };
  }
}

async function confirmRegistration(){
  const type = leagueRegType(selectedLeague.id);
  const msg = document.getElementById('reg-msg');
  msg.className='msg'; msg.textContent='';

  let partnerUserId = null, partnerName = null;
  if(type === 'partner'){
    partnerUserId = document.getElementById('partner-sel').value;
    if(!partnerUserId){ msg.className='msg error'; msg.textContent='Please select your partner.'; return; }
    const pp = partnerOptions.find(x => x.id === partnerUserId);
    partnerName = pp ? `${pp.first_name||''} ${pp.last_name||''}`.trim() : null;
  }

  const btn = document.getElementById('confirm-btn');
  btn.disabled = true; btn.textContent = switchMode ? 'Switching...' : 'Registering...';

  const p = currentProfile;

  // If switching leagues, remove the existing membership first (clears partner link)
  if(switchMode && myMembership){
    const { error: delErr } = await sb.from('league_members').delete().eq('id', myMembership.id);
    if(delErr){
      btn.disabled=false; btn.textContent='Register for '+selectedLeague.name;
      msg.className='msg error'; msg.textContent = 'Could not switch: ' + delErr.message;
      return;
    }
    myMembership = null;
  }

  // If the chosen partner already invited ME to this same league, this is a
  // mutual choice — accept their invite instead of creating a competing one.
  // (The edge function creates my membership row as part of accepting.)
  if(partnerUserId){
    const mutual = await fetchInviteFrom(partnerUserId, selectedLeague.id);
    if(mutual){
      const ok = await respondPartnerInvite(partnerUserId, 'accept');
      if(!ok.success){
        btn.disabled=false; btn.textContent='Register for '+selectedLeague.name;
        msg.className='msg error'; msg.textContent = ok.error || 'Could not accept partner invite.';
        return;
      }
      showRegSuccess(`You and <strong>${partnerName}</strong> are now partners — they had already chosen you!`);
      notifyPartner(partnerUserId, `${p.first_name||''} ${p.last_name||''}`.trim(), selectedLeague.name, 'accepted');
      return;
    }
  }

  // ── DUPR User Gating ──────────────────────────────────────────────
  // Every player in a rated league must hold BASIC_L1. Verify before
  // creating the membership.
  const gate = await verifyDuprEligibility(p.dupr_id, selectedLeague);
  if(!gate.eligible){
    btn.disabled=false; btn.textContent = switchMode ? 'Switch to '+selectedLeague.name : 'Register for '+selectedLeague.name;
    msg.className='msg error'; msg.innerHTML = gate.message;
    return;
  }

  const { error } = await sb.from('league_members').insert({
    league_id: selectedLeague.id,
    season_id: activeSeasonId,
    user_id: currentUser.id,
    partner_user_id: partnerUserId || null,
    first_name: p.first_name,
    last_name: p.last_name,
    email: p.email,
    phone: p.phone,
    partner_name: partnerName,
    partner_status: partnerUserId ? 'pending' : null,
    status: 'active'
  });

  if(error){
    btn.disabled=false; btn.textContent='Register for '+selectedLeague.name;
    if(error.code === '23505'){ msg.className='msg error'; msg.textContent='You are already registered for this league.'; }
    else { msg.className='msg error'; msg.textContent = error.message; }
    return;
  }

  // Alert the selected partner that they've been invited.
  notifyPartner(partnerUserId, `${p.first_name||''} ${p.last_name||''}`.trim(), selectedLeague.name, 'pending');

  // Keep dupr_players in sync with the player's profile. DUPR is linked at connect time
  // (which writes profiles.dupr_id), but the league features — player page rating,
  // standings ratings, and DUPR match submission — resolve players by their schedule
  // name through dupr_players. Mirror the id into that name-keyed table for this league,
  // deriving player_name exactly as the admin schedule generator does ("First L.").
  if(p.dupr_id){
    const scheduleName = deriveScheduleName(p.first_name, p.last_name);
    try{
      await fetch(`${SUPABASE_URL}/rest/v1/dupr_players`, {
        method:'POST',
        headers:{
          'apikey':SUPABASE_KEY,
          'Authorization':'Bearer '+SUPABASE_KEY,
          'Content-Type':'application/json',
          'Prefer':'resolution=merge-duplicates'
        },
        body: JSON.stringify({
          league_key: selectedLeague.id,
          player_name: scheduleName,
          dupr_id: p.dupr_id
        })
      });
    }catch(e){ console.warn('Could not sync dupr_players on registration:', e); }
  }

  // Email notification (reuse registration-notification function)
  fetch('https://owsvfvhlbagxxmncwmtn.supabase.co/functions/v1/registration-notification', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+SUPABASE_KEY,'apikey':SUPABASE_KEY},
    body: JSON.stringify({
      firstName:p.first_name, lastName:p.last_name, email:p.email, phone:p.phone,
      leagueName:selectedLeague.name + (partnerName?` (partner: ${partnerName})`:''),
      adminEmail:'kdmullins222@gmail.com'
    })
  }).catch(()=>{});

  showRegSuccess(partnerName ? `Your partner: <strong>${partnerName}</strong> — they'll be asked to accept next time they sign in.` : '');
}

function showRegSuccess(partnerLine){
  document.getElementById('page').innerHTML = `
    <div class="success-wrap" style="display:block">
      <div class="success-icon">🎉</div>
      <h2>You're Registered!</h2>
      <p>You've joined <strong>${selectedLeague.name}</strong> for ${activeSeasonName}.${partnerLine ? ' ' + partnerLine : ''}</p>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-primary" href="dev-dashboard.html" style="text-decoration:none;max-width:200px">My Dashboard</a>
        <a class="btn btn-primary" href="dev-signup.html" style="text-decoration:none;max-width:200px;background:transparent;color:var(--navy)">Manage Registration</a>
      </div>
    </div>`;
}

// Does `otherUserId` have an active registration in `leagueId` that names ME
// as their (pending) partner?
async function fetchInviteFrom(otherUserId, leagueId){
  try{
    const { data } = await sb.from('league_members').select('id,partner_status')
      .eq('user_id', otherUserId).eq('season_id', activeSeasonId)
      .eq('league_id', leagueId).eq('status','active')
      .eq('partner_user_id', currentUser.id).maybeSingle();
    return data || null;
  }catch(e){ return null; }
}

// Accept/decline a partner invite via the self-service edge function.
async function respondPartnerInvite(fromUserId, action){
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) return { success:false, error:'Not signed in' };
    const r = await fetch(`${SUPABASE_URL}/functions/v1/respond-partner-invite`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+session.access_token },
      body: JSON.stringify({ fromUserId, seasonId: activeSeasonId, action })
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok || !j.success) return { success:false, error: j.error || 'Request failed' };
    return j;
  }catch(e){ return { success:false, error: e.message }; }
}

async function doLogout(){
  await sb.auth.signOut();
  window.location.href = 'dev-auth.html';
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
