<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/jpg" href="favicon.jpg"/>
<title>NAC Pickleball</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
.home-wrap{max-width:700px;margin:0 auto;padding:2rem 1.5rem}
.home-header{text-align:center;padding:2rem 0 1.5rem}
.home-header img{height:110px;width:auto;object-fit:contain}
.home-header p{color:var(--muted);font-size:15px;margin-top:1rem}
/* Sign-in prompt card (only shows when logged out) */
.signin-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;box-shadow:0 1px 4px rgba(26,42,108,.06);margin-bottom:2rem;text-align:center;display:none}
.signin-card h2{font-family:var(--font-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy);margin-bottom:.25rem}
.signin-card p{color:var(--muted);font-size:14px;margin-bottom:1.2rem}
.signin-card .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.signin-card .btn{font-family:var(--font-display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:11px 26px;border-radius:var(--radius);text-decoration:none;border:1.5px solid transparent;transition:all .12s}
.btn-navy{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-navy:hover{background:var(--navy-dark)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}.btn-green:hover{background:var(--green-dark)}
.section-label{font-family:var(--font-display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px;text-align:center}
.leagues-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.league-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:1.5rem;cursor:pointer;transition:all .15s;box-shadow:0 1px 3px rgba(26,42,108,.05);display:flex;flex-direction:column;gap:6px;text-decoration:none}
.league-card:hover{border-color:var(--navy);box-shadow:0 4px 16px rgba(26,42,108,.12);transform:translateY(-2px)}
.league-card-title{font-family:var(--font-display);font-size:20px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--navy)}
.league-card-sub{font-size:13px;color:var(--muted)}
.t-badge{align-self:flex-start;font-family:var(--font-display);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 10px;border-radius:10px;margin-top:2px}
.t-badge.open{color:var(--green-dark);background:rgba(76,175,40,.12)}
.t-badge.live{color:#8a6d00;background:rgba(212,167,0,.16)}
.t-badge.done{color:var(--muted);background:var(--surface2)}
.t-badge.ext{color:var(--navy);background:rgba(26,42,108,.10)}
.t-badge.division{color:var(--navy);background:rgba(26,42,108,.09);text-transform:none;letter-spacing:.2px;font-weight:600;align-self:auto}
.dupr-chip{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-display);font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--green-dark,#3a8c1e);padding:2px 7px;border-radius:4px;vertical-align:middle;margin-left:6px;text-transform:uppercase}
.dupr-chip .dot{width:5px;height:5px;border-radius:50%;background:#fff;display:inline-block}
.t-badge.division .dupr-mini{color:var(--green-dark);font-weight:800;margin-left:5px}
/* Tournament card — matches the tournaments page: accent per tournament,
   scoreboard date block, and a pickleball whose hole pattern is derived from
   the tournament id (so each event looks slightly different). */
.tcard{position:relative;background:var(--white);border:1.5px solid var(--border);border-left:5px solid var(--ac,var(--navy));border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;transition:all .15s;box-shadow:0 1px 3px rgba(26,42,108,.05)}
.tcard:hover{border-color:var(--ac,var(--navy));box-shadow:0 4px 16px rgba(26,42,108,.12);transform:translateY(-2px)}
.tcard-head{position:relative;display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--border)}
.tcard-head::before{content:'';position:absolute;inset:0;background:var(--ac,var(--navy));opacity:.06;pointer-events:none}
.tball{position:absolute;right:-14px;top:50%;transform:translateY(-50%);width:86px;height:86px;color:var(--ac,var(--navy));opacity:.15;pointer-events:none}
.tdate{position:relative;z-index:1;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:48px;padding-right:13px;border-right:1px solid var(--border)}
.tdate-mo{font-family:var(--font-display);font-size:11px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;color:var(--ac,var(--navy))}
.tdate-day{font-family:var(--font-display);font-size:29px;font-weight:900;line-height:.95;color:var(--navy)}
.tdate-tba{font-family:var(--font-display);font-size:17px;font-weight:900;line-height:1;color:var(--muted)}
.tcard-main{position:relative;z-index:1;min-width:0;flex:1 1 auto}
.tcard-body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:6px}
.t-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t-title-row .league-card-title{line-height:1.15}
.t-title-row .t-badge{align-self:center;margin-top:0}
.t-divs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
@media(max-width:600px){
  nav{padding:0 1rem}
  .nav-greeting{display:none}
  .home-header img{height:80px}
  .home-wrap{padding:1.5rem 1rem}
  .league-card{padding:1.2rem}
  .league-card-title{font-size:17px}
  .leagues-grid{grid-template-columns:1fr}
}
/* --- mobile nav (responsive: logo centered on top, links centered below) --- */
@media(max-width:768px){
  nav{flex-wrap:wrap;justify-content:center}
  .nav-brand{width:100%;display:flex;justify-content:center;margin-right:0;padding:.5rem 0 .25rem}
  .nav-logo{height:64px}
  .home-header img{display:none}
  .home-header{padding-top:.5rem}
  .nav-greeting{display:none}
  .nav-actions:empty{display:none}
  .nav-actions,.nav-right,[data-account-nav]{display:flex;width:100%;margin-left:0;justify-content:center;flex-wrap:wrap}
  .nav-link{flex:0 1 auto;padding:.7rem .6rem;font-size:13px;text-align:center;white-space:nowrap}
  [data-account-nav] a{padding:.7rem .6rem!important;font-size:13px!important;text-align:center}
}
@media(max-width:400px){
  .nav-link,[data-account-nav] a{font-size:11px!important;padding:.6rem .4rem!important}
}
</style>
<script src="config.js"></script>
</head>
<body>
<nav id="main-nav" style="display:none">
  <a class="nav-brand" href="index.html"><img src="naclogo.png" class="nav-logo" alt="NAC" onerror="this.style.display='none'"/></a>
  <div class="nav-actions" id="nav-actions"></div>
  <div class="nav-right" id="nav-links">
  </div>
</nav>
<div class="home-wrap">
  <div class="home-header">
    <img src="logo.png" onerror="this.style.display='none'" alt="NAC Pickleball"/>
    <p>Everything for NAC league and tournament play — standings, schedules, and scores.</p>
  </div>

  <!-- Sign-in prompt (logged-out only) -->
  <div class="signin-card" id="signin-card">
    <h2>Join a League or Tournament</h2>
    <p>Sign in or create an account to register for leagues and tournaments, and connect your DUPR rating.</p>
    <div class="actions">
      <a class="btn btn-navy" href="auth.html">Sign In</a>
      <a class="btn btn-green" href="auth.html">Create Account</a>
    </div>
  </div>

  <!-- Tournaments sit above leagues. The section is hidden when there are none,
       so leagues naturally moves to the top without any extra logic. -->
  <div id="tournaments-section" style="display:none;margin-bottom:2rem">
    <div class="section-label">Tournaments</div>
    <div class="leagues-grid" id="tournaments-grid"></div>
  </div>

  <div class="section-label">View Leagues</div>
  <div class="leagues-grid" id="leagues-grid"><div style="color:var(--muted);font-size:14px;padding:1rem">Loading leagues…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// All NAC tournaments are at the complex — the venue is fixed, not per-event.
const NAC_VENUE = 'Nitro Athletic Complex';

// Readable site name for outbound tournament links.
function extHost(u){
  try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return 'their site'; }
}

const sb = (typeof supabase !== 'undefined') ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

// League cards are dynamic: catalog from pb_league 'nac_leagues' (fallback to
// the built-in six), filtered to the active season's enabled leagues.
const FALLBACK_LEAGUES = [
  {id:'beginner',  name:'All Ages Beginner',  sub:'Under 3.0 rating'},
  {id:'int1949',   name:'19-49 Intermediate', sub:'3.0 – 3.4 rating'},
  {id:'int50',     name:'50+ Intermediate',   sub:'3.0 – 3.4 rating'},
  {id:'adv1949',   name:'19-49 Advanced',     sub:'3.5 & up rating'},
  {id:'adv50',     name:'50+ Advanced',       sub:'3.5 & up rating'},
  {id:'singles',   name:'Singles',            sub:'Open singles league'},
];

// Accent + date + ball helpers, shared with the tournaments page so the two
// views render the same identity for a given tournament.
const T_ACCENTS = ['#1a2a6c','#3a8c1e','#b8860b','#0f6b6b','#8c2f39','#4a3b8c'];
function tAccent(t){
  const str = String(t.id || t.name || '');
  let h = 0; for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  return T_ACCENTS[h % T_ACCENTS.length];
}
const T_MO = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function tDateParts(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||''));
  return m ? { mo: T_MO[parseInt(m[2],10)-1], day: String(parseInt(m[3],10)) } : null;
}
// Hole count, ring spacing, hole size and rotation all come from the id. Real
// pickleballs differ (indoor ~26 large holes, outdoor ~40 small), so this
// variation reflects the object rather than being random decoration.
function nacBallSVG(seedStr){
  let h = 0; const str = String(seedStr||'');
  for(let i=0;i<str.length;i++) h = (h*31 + str.charCodeAt(i)) >>> 0;
  const rnd = (n) => { h = (h*1103515245 + 12345) >>> 0; return h % n; };
  const innerN = 5 + rnd(3), outerN = 9 + rnd(4);
  const hole = 3.6 + rnd(9) * 0.18;
  const rot = rnd(360) * Math.PI/180;
  const core = rnd(2) === 0, gap = 16 + rnd(5);
  const pts = [];
  if(core) pts.push([50,50]);
  for(let i=0;i<innerN;i++){ const a = rot + i*2*Math.PI/innerN; pts.push([50+Math.cos(a)*gap, 50+Math.sin(a)*gap]); }
  for(let i=0;i<outerN;i++){ const a = rot*0.6 + (i+0.5)*2*Math.PI/outerN; pts.push([50+Math.cos(a)*33, 50+Math.sin(a)*33]); }
  const dots = pts.map(([x,y]) => `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${hole.toFixed(1)}"/>`).join('');
  return `<svg class="tball" viewBox="0 0 100 100" fill="none" aria-hidden="true"><circle cx="50" cy="50" r="46" stroke="currentColor" stroke-width="3"/><g fill="currentColor">${dots}</g></svg>`;
}

async function renderLeagueCards(){
  const grid = document.getElementById('leagues-grid');
  if(!grid) return;
  let leagues = FALLBACK_LEAGUES;
  let enabled = null;
  try{
    if(!sb) throw new Error('client unavailable');
    const [lg, se] = await Promise.all([
      sb.from('pb_league').select('value').eq('key','nac_leagues').maybeSingle(),
      sb.from('pb_league').select('value').eq('key','nac_seasons').maybeSingle()
    ]);
    // A SAVED catalog is authoritative even when empty — that's how the site
    // legitimately shows no leagues. FALLBACK_LEAGUES is only for first run
    // (nothing saved yet).
    if(lg.data && lg.data.value && Array.isArray(lg.data.value.leagues)){
      leagues = lg.data.value.leagues;
    }
    if(se.data && se.data.value && se.data.value.seasons){
      const active = (se.data.value.seasons || []).find(x => x.id === se.data.value.active);
      if(active && Array.isArray(active.enabledLeagues)) enabled = active.enabledLeagues;
    }
  }catch(e){ console.warn('league cards: using fallback', e); }
  const show = enabled ? leagues.filter(l => enabled.includes(l.id)) : leagues;
  grid.innerHTML = show.map(l => `
    <a class="league-card" href="league.html?league=${l.id}">
      <div class="league-card-title">${l.name}${l.duprEnabled!==false?' <span class="dupr-chip" title="Matches count toward your DUPR rating"><span class="dot"></span>DUPR</span>':''}</div>
      <div class="league-card-sub">${l.sub||''}</div>
    </a>`).join('') || '<div style="color:var(--muted);font-size:14px;padding:1rem">No leagues are open right now — check back soon.</div>';
}
function nacFmtDate(d){
  if(!d) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));
  return m ? `${m[2]}/${m[3]}/${m[1]}` : d;
}
function fmtTime(hhmm){
  if(!hhmm || !/^\d{2}:\d{2}$/.test(hhmm)) return hhmm || '';
  let [h,m] = hhmm.split(':').map(Number);
  const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
renderLeagueCards();

// Tournaments: same card look as leagues. Live divisions link straight to the
// live pools/bracket view; otherwise the card goes to the tournaments page.
async function renderTournamentCards(){
  const sec = document.getElementById('tournaments-section');
  const grid = document.getElementById('tournaments-grid');
  if(!sec || !grid) return;
  let list = [];
  try{
    // Read via the same REST path the other pages use (works even if the
    // supabase-js client failed to load).
    const r = await fetch(`${SUPABASE_URL}/rest/v1/pb_league?key=eq.nac_tournaments&select=value`,
      { headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY } });
    if(r.ok){
      const rows = await r.json();
      const val = rows && rows[0] && rows[0].value;
      list = (val && Array.isArray(val.tournaments)) ? val.tournaments : [];
    } else {
      console.warn('tournaments load failed:', r.status);
    }
  }catch(e){ console.warn('tournaments load error:', e); return; }
  console.log('index tournaments loaded:', list.length);
  // Only advertise tournaments that actually have divisions — the tournaments
  // page hides division-less ones, so showing them here sends players to an
  // apparently-empty page.
  list = list.filter(t => t.external ? !!t.url : (t.divisions || []).length);
  if(!list.length) return;

  const cards = list.map(t => {
    const divs = t.divisions || [];
    const live = divs.some(d => d.phase==='pools' || d.phase==='knockout');
    const done = divs.length && divs.every(d => d.phase==='complete');
    const liveDiv = divs.find(d => d.phase==='pools' || d.phase==='knockout') || divs.find(d => d.phase==='complete');
    const href = t.external && t.url ? t.url
      : (live || done) && liveDiv
        ? `tournament.html?t=${encodeURIComponent(t.id)}&d=${encodeURIComponent(liveDiv.id)}`
        : 'tournaments.html';
    const extAttrs = t.external ? ' target="_blank" rel="noopener noreferrer"' : '';
    const badge = t.external ? '<span class="t-badge ext">Off-site</span>'
                : live ? '<span class="t-badge live">Live Now</span>'
                : done ? '<span class="t-badge done">Finished</span>'
                : t.regOpen ? '<span class="t-badge open">Registration Open</span>' : '';
    const clean = v => String(v||'').replace(/[<>&]/g,'');
    const divBadges = divs.length
      ? `<div class="t-divs">${divs.map(d => `<span class="t-badge division">${clean(d.name)}${d.startTime?` <span style="color:var(--muted);font-weight:600">${fmtTime(d.startTime)}</span>`:''}${d.duprEnabled!==false?'<span class="dupr-mini">• DUPR</span>':''}</span>`).join('')}</div>`
      : '';
    const ac = tAccent(t);
    const dp = tDateParts(t.date);
    return `<a class="tcard" style="--ac:${ac}" href="${href}"${extAttrs}>
      <div class="tcard-head">
        ${nacBallSVG(t.id || t.name || '')}
        <div class="tdate">
          ${dp ? `<span class="tdate-mo">${dp.mo}</span><span class="tdate-day">${dp.day}</span>`
               : `<span class="tdate-mo">Date</span><span class="tdate-tba">TBA</span>`}
        </div>
        <div class="tcard-main">
          <div class="t-title-row">
            <span class="league-card-title">${clean(t.name)}</span>
            ${badge}
          </div>
          <div class="league-card-sub">${clean(t.location || NAC_VENUE)}</div>
        </div>
      </div>
      <div class="tcard-body">${t.external
        ? `<span class="league-card-sub">Sign up on ${clean(extHost(t.url))} →</span>`
        : (divBadges || '<span class="league-card-sub">Divisions to be announced</span>')}</div>
    </a>`;
  }).join('');
  if(!cards) return;
  grid.innerHTML = cards;
  sec.style.display = '';
}
renderTournamentCards();

window.addEventListener('DOMContentLoaded', async () => {
  // Always reveal the nav first — its visibility must not depend on the session
  // check (which can fail if the supabase client didn't load).
  const signinCard = document.getElementById('signin-card');
  const mainNav = document.getElementById('main-nav');
  const navActions = document.getElementById('nav-actions');
  if(mainNav) mainNav.style.display = 'flex';

  if(!sb){
    // Client unavailable: show the logged-out affordances and stop.
    if(navActions) navActions.innerHTML = `<a class="nav-link" href="auth.html">Sign In</a>`;
    if(signinCard) signinCard.style.display = 'block';
    return;
  }
  const { data: { session } } = await sb.auth.getSession();

  if(session){
    // Logged in — show nav with greeting + actions
    let firstName = '';
    try{
      const { data } = await sb.from('profiles').select('first_name').eq('id', session.user.id).single();
      if(data && data.first_name) firstName = data.first_name;
    }catch(e){}

    navActions.innerHTML = `
      ${firstName ? `<span class="nav-greeting">Hi, ${firstName}</span>` : ''}
      <a class="nav-link" href="dashboard.html">My Profile</a>
      <a class="nav-link" href="#" onclick="doLogout();return false;">Sign Out</a>`;
    mainNav.style.display = 'flex';
    signinCard.style.display = 'none';
  } else {
    // Logged out — show the nav (Leagues / Rules on the right, Sign In button on the left) plus the sign-in prompt
    navActions.innerHTML = `<a class="nav-link" href="auth.html">Sign In</a>`;
    mainNav.style.display = 'flex';
    signinCard.style.display = 'block';
  }
});

async function doLogout(){
  await sb.auth.signOut();
  window.location.reload();
}
</script>
<script src="admin-nav.js"></script>
</body>
</html>
