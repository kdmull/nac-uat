<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Shot Dashboard · NAC Pickleball</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0f24; --panel:#121a3c; --panel-2:#0d1430;
    --line:#26327a; --line-soft:#1b2456;
    --ink:#e9ecf7; --muted:#8d96bd;
    --navy:#1a2a6c; --green:#4caf28; --gold:#d4a017; --red:#e05555;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Barlow',sans-serif;font-size:15px;line-height:1.45}
  h1,h2,h3,.disp{font-family:'Barlow Condensed',sans-serif;letter-spacing:.02em}
  button{font-family:inherit;cursor:pointer}
  input,select{font-family:inherit;font-size:14px;color:var(--ink);background:var(--panel-2);
    border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
  .btn{background:var(--green);color:#06210a;border:none;border-radius:6px;padding:9px 18px;font-weight:600;font-size:14px}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--muted)}

  header{display:flex;align-items:center;gap:14px;padding:10px 18px;
    border-bottom:1px solid var(--line-soft);background:var(--panel-2);flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700;text-transform:uppercase}
  header h1 span{color:var(--gold)}
  .header-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}

  .gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:26px;width:100%;max-width:460px}
  .card h2{font-size:26px;text-transform:uppercase;margin-bottom:4px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

  .wrap{max-width:1200px;margin:0 auto;padding:18px}
  .filters{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  .filters label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
  .panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px;grid-column:span 12}
  .panel h2{font-size:19px;font-weight:600;text-transform:uppercase;margin-bottom:2px}
  .panel .def{font-size:12px;color:var(--muted);margin-bottom:12px}
  .c4{grid-column:span 4}.c6{grid-column:span 6}.c8{grid-column:span 8}
  @media(max-width:900px){.c4,.c6,.c8{grid-column:span 12}}

  .bignums{display:flex;gap:22px;flex-wrap:wrap}
  .bignum .num{font-family:'Barlow Condensed';font-size:40px;font-weight:700;line-height:1}
  .bignum .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .bignum .n{font-size:12px;color:var(--muted)}

  /* stacked quality bar */
  .qbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel-2);margin:4px 0}
  .qbar .seg-clean{background:var(--green)} .qbar .seg-atk{background:var(--gold)} .qbar .seg-err{background:var(--red)}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
     text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid var(--line-soft)}
  td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
  tr.clickable{cursor:pointer}
  tr.clickable:hover td{background:var(--panel-2)}
  .lowN{color:var(--muted)}
  .pct-err{color:var(--red)} .pct-atk{color:var(--gold)} .pct-clean{color:var(--green)}

  /* matrix */
  .matrix{display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:8px;margin-top:10px}
  .m-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;align-self:end;padding-bottom:4px}
  .m-wing{font-family:'Barlow Condensed';font-weight:600;font-size:17px;align-self:center}
  .cell{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:8px;
    padding:10px;text-align:center;cursor:pointer;transition:border-color .1s}
  .cell:hover{border-color:var(--gold)}
  .cell .cn{font-family:'Barlow Condensed';font-size:24px;font-weight:700;line-height:1}
  .cell .cs{font-size:11px;color:var(--muted);margin-top:3px}
  .cell.hot{border-color:var(--red)}
  .cell.warm{border-color:var(--gold)}
  .cell.empty{opacity:.4;cursor:default}

  /* clips modal */
  .modal-bg{position:fixed;inset:0;background:rgba(4,7,20,.8);z-index:70;display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-bg.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    width:100%;max-width:640px;padding:20px}
  .modal h3{font-size:20px;text-transform:uppercase;margin-bottom:10px}
  .clip-row{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
  .clip-row a{color:var(--gold);text-decoration:none;font-family:'Barlow Condensed';font-weight:600;min-width:52px}
  .clip-row a:hover{text-decoration:underline}
  .clip-row .cd{flex:1}
  .clip-row .cg{color:var(--muted);font-size:12px}
  .modal .close{margin-top:14px}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  .empty-state{color:var(--muted);padding:30px;text-align:center}
</style>
<script src="../config.js"></script>
</head>
<body>

<div class="gate" id="authGate" style="display:none">
  <div class="card">
    <h2>Shot <span style="color:var(--gold)">Dashboard</span></h2>
    <p class="sub">Private analytics · sign in to continue</p>
    <div class="field"><label for="email">Email</label><input type="email" id="email" style="width:100%" autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" style="width:100%" autocomplete="current-password"></div>
    <button class="btn" id="signInBtn">Sign in</button>
    <p class="err" id="authErr"></p>
  </div>
</div>

<header>
  <h1>NAC <span>Shot Dashboard</span></h1>
  <div class="header-right">
    <a href="stats-tagger.html" style="color:var(--muted)">Tagger</a>
    <button class="btn ghost" id="signOutBtn">Sign out</button>
  </div>
</header>

<div class="wrap">
  <div class="filters">
    <label for="gameSel">Games</label>
    <select id="gameSel"><option value="all">All games</option></select>
    <span class="note" id="loadNote"></span>
  </div>
  <div class="grid" id="dash"><p class="empty-state">Loading…</p></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Clips</h3>
    <div id="modalList"></div>
    <p class="note">Links open YouTube at 5 seconds before contact.</p>
    <button class="btn ghost close" id="modalClose">Close</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= CONFIG — keep identical to the tagger ================= */
const OWNER_ID          = '';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TYPE_ORDER = ['serve','return','drop','drive','dink','dink_volley','speedup',
                    'counter','volley','overhead','lob','reset','atp'];
const TYPE_LBL = { serve:'Serve', return:'Return', drop:'Drop', drive:'Drive',
  dink:'Dink', dink_volley:'Dink volley', speedup:'Speedup', counter:'Counter',
  volley:'Volley', overhead:'Overhead', lob:'Lob', reset:'Reset', atp:'ATP' };
const KITCHEN_TYPES = new Set(['dink','dink_volley','speedup','counter']);
const MIN_N = 8;   // below this, percentages render muted

let videos = [], rallies = [], shots = [];
const $ = id => document.getElementById(id);

/* ================= auth + boot ================= */
async function boot() {
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) { $('authGate').style.display = 'flex'; return; }
  if (OWNER_ID && session.user.id !== OWNER_ID) {
    $('authGate').style.display = 'flex';
    $('authErr').textContent = 'This account is not authorized.'; return;
  }
  loadData();
}
$('signInBtn').addEventListener('click', async () => {
  $('authErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(), password: $('password').value });
  if (error) { $('authErr').textContent = error.message; return; }
  $('authGate').style.display = 'none';
  loadData();
});
$('password').addEventListener('keydown', e => { if (e.key==='Enter') $('signInBtn').click(); });
$('signOutBtn').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* ================= data ================= */
async function loadData() {
  const [v, r, s] = await Promise.all([
    sb.from('stats_videos').select('*').order('played_on', { ascending:false }),
    sb.from('stats_rallies').select('*'),
    sb.from('stats_shots').select('*'),
  ]);
  if (v.error || r.error || s.error) {
    $('dash').innerHTML = `<p class="empty-state">Load failed: ${(v.error||r.error||s.error).message}</p>`;
    return;
  }
  videos = v.data; rallies = r.data; shots = s.data;
  const sel = $('gameSel');
  sel.innerHTML = '<option value="all">All games</option>' + videos.map(x =>
    `<option value="${x.id}">${[x.played_on, x.title || x.youtube_id].filter(Boolean).join(' · ')}</option>`).join('');
  sel.addEventListener('change', render);
  render();
}

/* ================= helpers ================= */
const pct = (n, d) => d ? Math.round(100*n/d) : 0;
const fmtT = sec => { sec=Math.max(0,Math.round(sec)); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); };
function qualityCounts(list) {
  const q = { clean:0, attackable:0, error:0, untagged:0 };
  for (const s of list) q[s.quality || 'untagged']++;
  const rated = q.clean + q.attackable + q.error;
  return { ...q, rated };
}
function qbarHTML(q) {
  if (!q.rated) return '<div class="qbar"></div>';
  return `<div class="qbar">
    <div class="seg-clean" style="width:${100*q.clean/q.rated}%"></div>
    <div class="seg-atk" style="width:${100*q.attackable/q.rated}%"></div>
    <div class="seg-err" style="width:${100*q.error/q.rated}%"></div></div>`;
}
function pctCell(n, d, cls) {
  if (!d) return '<td class="r lowN">—</td>';
  const dim = d < MIN_N ? ' lowN' : '';
  return `<td class="r ${cls}${dim}">${pct(n,d)}%</td>`;
}

/* ================= render ================= */
function render() {
  const gid = $('gameSel').value;
  const vSet = gid === 'all' ? new Set(videos.map(v=>v.id)) : new Set([gid]);
  const R = rallies.filter(r => vSet.has(r.video_id));
  const rById = Object.fromEntries(R.map(r => [r.id, r]));
  const S = shots.filter(s => vSet.has(s.video_id));
  const vById = Object.fromEntries(videos.map(v => [v.id, v]));
  $('loadNote').textContent = `${S.length} shots · ${R.length} rallies · ${vSet.size === videos.length ? videos.length : 1} game(s)`;

  if (!S.length && !R.length) {
    $('dash').innerHTML = '<p class="empty-state">No data yet for this selection. Go tag a game.</p>';
    return;
  }

  const closed = R.filter(r => r.won_by);
  const won = closed.filter(r => r.won_by === 'us');

  /* --- shots by rally, for rally-level flags --- */
  const shotsByRally = {};
  for (const s of S) (shotsByRally[s.rally_id] ??= []).push(s);

  /* --- third shots: my first shot of a rally we served, drop or drive --- */
  const thirds = S.filter(s => {
    const r = rById[s.rally_id];
    return r && r.serving_team === 'us' && s.shot_number === 1 &&
           (s.shot_type === 'drop' || s.shot_type === 'drive');
  });
  const tDrops = thirds.filter(s => s.shot_type === 'drop');
  const tDrives = thirds.filter(s => s.shot_type === 'drive');
  const qDrop = qualityCounts(tDrops), qDrive = qualityCounts(tDrives);

  /* --- kitchen --- */
  const kitchenRallies = R.filter(r => (shotsByRally[r.id]||[]).some(s => KITCHEN_TYPES.has(s.shot_type)));
  const kClosed = kitchenRallies.filter(r => r.won_by);
  const kWon = kClosed.filter(r => r.won_by === 'us');

  /* --- firefights --- */
  const ff = R.filter(r => (shotsByRally[r.id]||[]).some(s => s.shot_type==='speedup' || s.shot_type==='counter'));
  const ffClosed = ff.filter(r => r.won_by);
  const ffWon = ffClosed.filter(r => r.won_by==='us');
  const ffInit = ffClosed.filter(r => (shotsByRally[r.id]||[]).some(s => s.shot_type==='speedup'));
  const ffInitWon = ffInit.filter(r => r.won_by==='us');
  const ffDef = ffClosed.filter(r => !(shotsByRally[r.id]||[]).some(s => s.shot_type==='speedup'));
  const ffDefWon = ffDef.filter(r => r.won_by==='us');

  /* --- rally-end blend --- */
  const lost = closed.filter(r => r.won_by === 'them');
  const myEnders = closed.filter(r => r.ended_by === 'me');
  const myWinners = myEnders.filter(r => r.end_type === 'winner');
  const myUnforced = myEnders.filter(r => r.end_type === 'unforced_error');
  const myForced = myEnders.filter(r => r.end_type === 'forced_error');
  const atkSurrendered = S.filter(s => s.quality === 'attackable');

  /* --- quality by type --- */
  const types = TYPE_ORDER.filter(t => S.some(s => s.shot_type === t));
  const typeRows = types.map(t => {
    const list = S.filter(s => s.shot_type === t);
    return { t, list, q: qualityCounts(list) };
  });
  const dinkAll = S.filter(s => s.shot_type==='dink' || s.shot_type==='dink_volley');

  /* --- HTML --- */
  let html = '';

  html += `<div class="panel c4"><h2>Overview</h2>
    <div class="def">Everything on this page counts only your shots.</div>
    <div class="bignums">
      <div class="bignum"><div class="num">${S.length}</div><div class="lbl">Shots</div></div>
      <div class="bignum"><div class="num">${R.length}</div><div class="lbl">Rallies</div></div>
      <div class="bignum"><div class="num" style="color:var(--green)">${pct(won.length, closed.length)}%</div>
        <div class="lbl">Rallies won</div><div class="n">n=${closed.length}</div></div>
    </div></div>`;

  html += `<div class="panel c4"><h2>Kitchen</h2>
    <div class="def">Rallies where you hit a dink, dink volley, speedup, or counter.</div>
    <div class="bignums">
      <div class="bignum"><div class="num">${pct(kitchenRallies.length, R.length)}%</div>
        <div class="lbl">Kitchen rally rate</div><div class="n">${kitchenRallies.length} of ${R.length}</div></div>
      <div class="bignum"><div class="num" style="color:var(--green)">${pct(kWon.length, kClosed.length)}%</div>
        <div class="lbl">Won when there</div><div class="n">n=${kClosed.length}</div></div>
    </div></div>`;

  html += `<div class="panel c4"><h2>Firefights</h2>
    <div class="def">Rallies containing your speedup or counter.</div>
    <div class="bignums">
      <div class="bignum"><div class="num" style="color:var(--green)">${pct(ffWon.length, ffClosed.length)}%</div>
        <div class="lbl">Win rate</div><div class="n">n=${ffClosed.length}</div></div>
      <div class="bignum"><div class="num">${pct(ffInitWon.length, ffInit.length)}%</div>
        <div class="lbl">You initiated</div><div class="n">n=${ffInit.length}</div></div>
      <div class="bignum"><div class="num">${pct(ffDefWon.length, ffDef.length)}%</div>
        <div class="lbl">Defending</div><div class="n">n=${ffDef.length}</div></div>
    </div></div>`;

  html += `<div class="panel c6"><h2>Third shots</h2>
    <div class="def">Your first tagged shot in rallies your team served, when it was a drop or drive.</div>
    <div class="bignums" style="margin-bottom:10px">
      <div class="bignum"><div class="num">${pct(tDrops.length, thirds.length)}%</div>
        <div class="lbl">Drop rate</div><div class="n">${tDrops.length} drops / ${tDrives.length} drives</div></div>
    </div>
    <div style="font-size:13px;color:var(--muted)">Drops (n=${qDrop.rated})</div>${qbarHTML(qDrop)}
    <div style="font-size:13px;color:var(--muted);margin-top:8px">Drives (n=${qDrive.rated})</div>${qbarHTML(qDrive)}
    <div class="legend">
      <span><span class="dot" style="background:var(--green)"></span>Clean</span>
      <span><span class="dot" style="background:var(--gold)"></span>Attackable</span>
      <span><span class="dot" style="background:var(--red)"></span>Error</span>
    </div></div>`;

  html += `<div class="panel c6"><h2>Rally endings</h2>
    <div class="def">How rallies ended, from your Enter-key tags.</div>
    <div class="bignums">
      <div class="bignum"><div class="num" style="color:var(--green)">${myWinners.length}</div><div class="lbl">Your winners</div></div>
      <div class="bignum"><div class="num" style="color:var(--red)">${myUnforced.length}</div><div class="lbl">Your unforced</div></div>
      <div class="bignum"><div class="num">${myForced.length}</div><div class="lbl">Your forced</div></div>
      <div class="bignum"><div class="num" style="color:var(--gold)">${atkSurrendered.length}</div><div class="lbl">Attackables fed</div></div>
    </div>
    <p class="note">Of ${lost.length} rallies lost, ${pct(myUnforced.length, lost.length)}% ended on your unforced error.
    "Attackables fed" counts every shot you tagged attackable — the quiet leak that never shows up as an error.</p></div>`;

  html += `<div class="panel c6"><h2>Quality by shot type</h2>
    <div class="def">Click a row to see the clips. Muted % = sample under ${MIN_N}.</div>
    <table><thead><tr><th>Shot</th><th class="r">n</th><th class="r">Clean</th><th class="r">Attackable</th><th class="r">Error</th></tr></thead>
    <tbody>` +
    typeRows.map(row =>
      `<tr class="clickable" data-type="${row.t}"><td>${TYPE_LBL[row.t]}</td>
       <td class="r">${row.list.length}</td>
       ${pctCell(row.q.clean, row.q.rated, 'pct-clean')}
       ${pctCell(row.q.attackable, row.q.rated, 'pct-atk')}
       ${pctCell(row.q.error, row.q.rated, 'pct-err')}</tr>`).join('') +
    (dinkAll.length && types.includes('dink_volley') ? (() => {
      const q = qualityCounts(dinkAll);
      return `<tr class="clickable" data-type="__dinks"><td style="color:var(--muted)">Dinks (all)</td>
        <td class="r">${dinkAll.length}</td>
        ${pctCell(q.clean,q.rated,'pct-clean')}${pctCell(q.attackable,q.rated,'pct-atk')}${pctCell(q.error,q.rated,'pct-err')}</tr>`;
    })() : '') +
    `</tbody></table></div>`;

  html += `<div class="panel c6"><h2>Wing × direction</h2>
    <div class="def">Pick a shot type. Each cell: shots, then attackable% / error%. Click for clips.</div>
    <select id="matrixSel" style="margin-bottom:4px">${types.map(t =>
      `<option value="${t}" ${t==='dink'?'selected':''}>${TYPE_LBL[t]}</option>`).join('')}</select>
    <div class="matrix" id="matrix"></div></div>`;

  $('dash').innerHTML = html;

  /* --- wire interactions --- */
  document.querySelectorAll('tr.clickable').forEach(tr =>
    tr.addEventListener('click', () => {
      const t = tr.dataset.type;
      const list = t === '__dinks' ? dinkAll : S.filter(s => s.shot_type === t);
      openClips((t === '__dinks' ? 'All dinks' : TYPE_LBL[t]), list, vById, rById);
    }));

  const mSel = $('matrixSel');
  const drawMatrix = () => {
    const t = mSel.value;
    const list = S.filter(s => s.shot_type === t);
    const grid = $('matrix');
    let m = `<div></div><div class="m-head">Cross</div><div class="m-head">Middle</div><div class="m-head">Line</div>`;
    for (const wing of ['forehand','backhand']) {
      m += `<div class="m-wing">${wing === 'forehand' ? 'FH' : 'BH'}</div>`;
      for (const dir of ['crosscourt','middle','line']) {
        const cellShots = list.filter(s => s.wing === wing && s.direction === dir);
        const q = qualityCounts(cellShots);
        const errP = pct(q.error, q.rated), atkP = pct(q.attackable, q.rated);
        const cls = !cellShots.length ? ' empty'
          : (q.rated >= MIN_N && errP >= 30) ? ' hot'
          : (q.rated >= MIN_N && (errP + atkP) >= 40) ? ' warm' : '';
        m += `<div class="cell${cls}" data-wing="${wing}" data-dir="${dir}">
          <div class="cn">${cellShots.length}</div>
          <div class="cs">${q.rated ? atkP + '% atk · ' + errP + '% err' : '—'}</div></div>`;
      }
    }
    grid.innerHTML = m;
    grid.querySelectorAll('.cell:not(.empty)').forEach(c =>
      c.addEventListener('click', () => {
        const cellShots = list.filter(s => s.wing === c.dataset.wing && s.direction === c.dataset.dir);
        openClips(`${TYPE_LBL[t]} · ${c.dataset.wing} · ${c.dataset.dir}`, cellShots, vById, rById);
      }));
  };
  mSel.addEventListener('change', drawMatrix);
  drawMatrix();
}

/* ================= clips modal ================= */
function openClips(title, list, vById, rById) {
  $('modalTitle').textContent = title + ` (${list.length})`;
  const sorted = [...list].sort((a,b) => a.timestamp_sec - b.timestamp_sec);
  $('modalList').innerHTML = sorted.map(s => {
    const v = vById[s.video_id];
    const url = `https://www.youtube.com/watch?v=${v.youtube_id}&t=${Math.max(0, Math.floor(s.timestamp_sec) - 5)}s`;
    const bits = [s.wing==='forehand'?'FH':s.wing==='backhand'?'BH':null,
                  s.direction, s.error_subtype].filter(Boolean).join(' · ');
    return `<div class="clip-row">
      <a href="${url}" target="_blank" rel="noopener">${fmtT(s.timestamp_sec)}</a>
      <span class="cd">${TYPE_LBL[s.shot_type]}${bits ? ' · ' + bits : ''}</span>
      <span class="cg">${s.quality || ''}${v && v.played_on ? ' · ' + v.played_on : ''}</span></div>`;
  }).join('') || '<p class="empty-state">No shots here.</p>';
  $('modalBg').classList.add('on');
}
$('modalClose').addEventListener('click', () => $('modalBg').classList.remove('on'));
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) $('modalBg').classList.remove('on'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('modalBg').classList.remove('on'); });

boot();
</script>
</body>
</html>
